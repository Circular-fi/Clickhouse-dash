name: chdash-tests

x-clickhouse-env: &clickhouse-env
  CLICKHOUSE_DB: default
  CLICKHOUSE_USER: "${CLICKHOUSE_USER:-test}"
  CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-test}"
  CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"

x-clickhouse-ulimits: &clickhouse-ulimits
  nofile:
    soft: 262144
    hard: 262144

# The probe goes through the container's own network address, not 127.0.0.1:
# while the image runs its init scripts, the server (and the embedded Keeper)
# listens on 127.0.0.1 only, so a loopback probe would report the primary
# healthy before the replica, ChDash or the fixture can reach it.
x-clickhouse-healthcheck: &clickhouse-healthcheck
  test:
    [
      "CMD-SHELL",
      "clickhouse-client --host \"$$(hostname)\" --port 9000 --user \"$${CLICKHOUSE_USER}\" --password \"$${CLICKHOUSE_PASSWORD}\" --query 'SELECT 1' | grep -q '1'",
    ]
  interval: 2s
  timeout: 2s
  retries: 90
  start_period: 5s

services:
  clickhouse:
    image: "${CLICKHOUSE_IMAGE:-clickhouse:26.7.5.10@sha256:d0e74e9970998f92c0490c23345259a539550eff24f551dbe385d3cd29481f74}"
    container_name: chdash-tests-clickhouse
    restart: unless-stopped
    environment: *clickhouse-env
    ports:
      - "${CLICKHOUSE_TCP_PORT:-19000}:9000"
      - "${CLICKHOUSE_HTTP_PORT:-18123}:8123"
    ulimits: *clickhouse-ulimits
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - type: bind
        source: ./clickhouse-init
        target: /docker-entrypoint-initdb.d
        read_only: true
      - type: bind
        source: ./clickhouse-config/fixture-storage.xml
        target: /etc/clickhouse-server/config.d/fixture-storage.xml
        read_only: true
      - type: bind
        source: ./clickhouse-config/keeper.xml
        target: /etc/clickhouse-server/config.d/keeper.xml
        read_only: true
      - type: bind
        source: ./clickhouse-config/replication.xml
        target: /etc/clickhouse-server/config.d/replication.xml
        read_only: true
      - type: bind
        source: ./clickhouse-config/node-r1.xml
        target: /etc/clickhouse-server/config.d/node.xml
        read_only: true
    healthcheck: *clickhouse-healthcheck

  # Second replica of chdash_cluster. The primary embeds ClickHouse Keeper, so
  # ReplicatedMergeTree fixtures (chdash_repl) have two live replicas and the
  # Explorer's replication metadata (replica counts, queues) is testable. Its
  # init script creates those fixtures on a fresh stack: ON CLUSTER DDL needs
  # both replicas, so the primary's init cannot (clickhouse-cluster/*.sh).
  clickhouse_replica:
    image: "${CLICKHOUSE_IMAGE:-clickhouse:26.7.5.10@sha256:d0e74e9970998f92c0490c23345259a539550eff24f551dbe385d3cd29481f74}"
    container_name: chdash-tests-clickhouse-replica
    restart: unless-stopped
    environment: *clickhouse-env
    ulimits: *clickhouse-ulimits
    depends_on:
      clickhouse:
        condition: service_healthy
        restart: false
    volumes:
      - clickhouse_replica_data:/var/lib/clickhouse
      - type: bind
        source: ./clickhouse-cluster/04-replicated-fixtures.sh
        target: /docker-entrypoint-initdb.d/04-replicated-fixtures.sh
        read_only: true
      - type: bind
        source: ./clickhouse-cluster/04-replicated-fixtures.sql
        target: /chdash-fixtures/04-replicated-fixtures.sql
        read_only: true
      - type: bind
        source: ./clickhouse-config/replication.xml
        target: /etc/clickhouse-server/config.d/replication.xml
        read_only: true
      - type: bind
        source: ./clickhouse-config/node-r2.xml
        target: /etc/clickhouse-server/config.d/node.xml
        read_only: true
    healthcheck: *clickhouse-healthcheck

  otel_fixture:
    profiles: ["otel", "test"]
    image: chdash-tests-otel-fixture:local
    pull_policy: build
    build:
      context: ..
      dockerfile: ./tests/otel-fixture/Dockerfile
    container_name: chdash-tests-otel-fixture
    restart: unless-stopped
    depends_on:
      clickhouse:
        condition: service_healthy
        restart: false
    environment:
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-test}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-test}"
      OTEL_FIXTURE_TRACES: "${OTEL_FIXTURE_TRACES:-10000}"
      OTEL_FIXTURE_MIN_SPANS: "${OTEL_FIXTURE_MIN_SPANS:-60}"
      OTEL_FIXTURE_MAX_SPANS: "${OTEL_FIXTURE_MAX_SPANS:-90}"
      OTEL_FIXTURE_SEED: "${OTEL_FIXTURE_SEED:-20260918}"
      OTEL_FIXTURE_ERROR_RATE: "${OTEL_FIXTURE_ERROR_RATE:-0.0002}"
      OTEL_FIXTURE_BATCH_TRACES: "${OTEL_FIXTURE_BATCH_TRACES:-100}"
      OTEL_FIXTURE_SPREAD_MINUTES: "${OTEL_FIXTURE_SPREAD_MINUTES:-55}"
      OTEL_FIXTURE_GENERATOR: "${OTEL_FIXTURE_GENERATOR:-auto}"
      OTEL_FIXTURE_SQL_THRESHOLD: "${OTEL_FIXTURE_SQL_THRESHOLD:-50000}"
      OTEL_FIXTURE_SQL_CHUNK_TRACES: "${OTEL_FIXTURE_SQL_CHUNK_TRACES:-2000000}"
      OTEL_FIXTURE_SQL_TARGET_SPANS_PER_CHUNK: "${OTEL_FIXTURE_SQL_TARGET_SPANS_PER_CHUNK:-1000000}"
      OTEL_FIXTURE_SQL_PROCESSES: "${OTEL_FIXTURE_SQL_PROCESSES:-4}"
      OTEL_FIXTURE_SQL_MAX_THREADS: "${OTEL_FIXTURE_SQL_MAX_THREADS:-0}"
      OTEL_FIXTURE_INSERT_TIMEOUT_SECONDS: "${OTEL_FIXTURE_INSERT_TIMEOUT_SECONDS:-1800}"
      OTEL_FIXTURE_FORCE: "${OTEL_FIXTURE_FORCE:-0}"
      # Logs (otel_logs) and metrics (otel_metrics_*) derived from the stored
      # spans. Idempotent: a complete earlier load is kept unless
      # OTEL_FIXTURE_SIGNALS_FORCE=1 (rebuilds logs/metrics only).
      OTEL_FIXTURE_LOGS: "${OTEL_FIXTURE_LOGS:-1}"
      OTEL_FIXTURE_METRICS: "${OTEL_FIXTURE_METRICS:-1}"
      OTEL_FIXTURE_SIGNALS_FORCE: "${OTEL_FIXTURE_SIGNALS_FORCE:-0}"
      OTEL_FIXTURE_SIGNALS_WINDOW_MINUTES: "${OTEL_FIXTURE_SIGNALS_WINDOW_MINUTES:-1440}"
      OTEL_FIXTURE_LOGS_DENSE_MINUTES: "${OTEL_FIXTURE_LOGS_DENSE_MINUTES:-60}"
      OTEL_FIXTURE_LOGS_TRACE_SAMPLE: "${OTEL_FIXTURE_LOGS_TRACE_SAMPLE:-16}"
      OTEL_FIXTURE_LOGS_SPAN_SAMPLE: "${OTEL_FIXTURE_LOGS_SPAN_SAMPLE:-4}"
      # Rich dataset on 2026-09-12 UTC (tests/README.md, "Rich OTel dataset"):
      # nested traces, errors, exceptions, links, semantic-convention
      # attributes, correlated logs and metrics. Idempotent per part (table
      # comment marker); OTEL_FIXTURE_RICH_FORCE=1 deletes and rebuilds that
      # day only.
      OTEL_FIXTURE_RICH: "${OTEL_FIXTURE_RICH:-1}"
      OTEL_FIXTURE_RICH_TRACES: "${OTEL_FIXTURE_RICH_TRACES:-40000}"
      OTEL_FIXTURE_RICH_SEED: "${OTEL_FIXTURE_RICH_SEED:-20260912}"
      OTEL_FIXTURE_RICH_LOGS: "${OTEL_FIXTURE_RICH_LOGS:-1}"
      OTEL_FIXTURE_RICH_METRICS: "${OTEL_FIXTURE_RICH_METRICS:-1}"
      OTEL_FIXTURE_RICH_FORCE: "${OTEL_FIXTURE_RICH_FORCE:-0}"
      OTEL_FIXTURE_KEEPALIVE: "1"
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/fixture-ready"]
      interval: 2s
      timeout: 1s
      retries: 3600
      start_period: 1s

  chdash_source:
    image: chdash-tests-source:local
    pull_policy: build
    build:
      context: ..
      dockerfile: ./tests/Dockerfile.source
      args:
        CHDASH_SEMVER: "${SOURCE_SEMVER:-source-tests}"
        CHDASH_GIT_SHA: "${SOURCE_GIT_SHA:-local}"
        CHDASH_BUILD_TIME: "${SOURCE_BUILD_TIME:-docker-compose}"
        SOURCE_CMAKE_BUILD_TYPE: "${SOURCE_CMAKE_BUILD_TYPE:-Release}"
    container_name: chdash-tests-source
    restart: unless-stopped
    stop_grace_period: 2s
    depends_on:
      clickhouse:
        condition: service_healthy
        restart: false
    environment:
      CHDASH_CONFIG_FILE: /config/CH_HOSTS.hcl
    volumes:
      - type: bind
        source: ${CH_HOSTS_SOURCE_CONFIG:-./config/CH_HOSTS.local.hcl}
        target: /config/CH_HOSTS.hcl
        read_only: true
    ports:
      - "${SOURCE_PORT:-18080}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8080/api/version | grep -q '"name":"clickhouse-dash"'
      interval: 2s
      timeout: 2s
      retries: 120
      start_period: 2s

  # Two more servers of the test image, each with the configuration that a spec needs. The browser specs that run on
  # them name them by MCP_CONTRACT_BASE_URL and QUERY_LIBRARY_LIVE_URL: without them those specs would skip, and the run
  # would be green with a contract unchecked (CHDASH_REQUIRE_FIXTURES=1 turns a missing instance into a failure).
  # Each writes its files to a volume of its own; the specs delete what they make.
  chdash_mcp:
    profiles: ["test"]
    image: chdash-tests-source:local
    container_name: chdash-tests-mcp
    restart: unless-stopped
    stop_grace_period: 2s
    depends_on:
      clickhouse:
        condition: service_healthy
        restart: false
      chdash_source:
        condition: service_healthy
    environment:
      CHDASH_CONFIG_FILE: /config/chdash.hcl
    volumes:
      - type: bind
        source: ./config/mcp.hcl
        target: /config/chdash.hcl
        read_only: true
      - mcp_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/version | grep -q '\"name\":\"clickhouse-dash\"'"]
      interval: 2s
      timeout: 2s
      retries: 120
      start_period: 2s

  chdash_qlib:
    profiles: ["test"]
    image: chdash-tests-source:local
    container_name: chdash-tests-qlib
    restart: unless-stopped
    stop_grace_period: 2s
    depends_on:
      clickhouse:
        condition: service_healthy
        restart: false
      chdash_source:
        condition: service_healthy
    environment:
      CHDASH_CONFIG_FILE: /config/chdash.hcl
    volumes:
      - type: bind
        source: ./config/query-library.writable.hcl
        target: /config/chdash.hcl
        read_only: true
      - qlib_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/version | grep -q '\"name\":\"clickhouse-dash\"'"]
      interval: 2s
      timeout: 2s
      retries: 120
      start_period: 2s

  # One server of the test image for each file of backend-functional that needs a configuration of its own (tests/README.md, "Backend
  # functional"): the hosts of the OpenTelemetry overrides, the allowlist of the trace services, the privilege matrix (its MCP keys are
  # written to a volume of its own) and the two degraded System configurations. The `tests` service names them by variable.
  chdash_otel_hosts:
    profiles: ["test"]
    image: chdash-tests-source:local
    container_name: chdash-tests-otel-hosts
    restart: unless-stopped
    stop_grace_period: 2s
    depends_on: &instance_depends
      clickhouse:
        condition: service_healthy
        restart: false
      chdash_source:
        condition: service_healthy
    environment:
      CHDASH_CONFIG_FILE: /config/chdash.hcl
    volumes:
      - type: bind
        source: ./config/otel-hosts.hcl
        target: /config/chdash.hcl
        read_only: true
    healthcheck: &instance_health
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/api/version | grep -q '\"name\":\"clickhouse-dash\"'"]
      interval: 2s
      timeout: 2s
      retries: 120
      start_period: 2s

  chdash_traces_allowlist:
    profiles: ["test"]
    image: chdash-tests-source:local
    container_name: chdash-tests-traces-allowlist
    restart: unless-stopped
    stop_grace_period: 2s
    depends_on: *instance_depends
    environment:
      CHDASH_CONFIG_FILE: /config/chdash.hcl
    volumes:
      - type: bind
        source: ./config/traces-allowlist.hcl
        target: /config/chdash.hcl
        read_only: true
    healthcheck: *instance_health

  chdash_privileges:
    profiles: ["test"]
    image: chdash-tests-source:local
    container_name: chdash-tests-privileges
    restart: unless-stopped
    stop_grace_period: 2s
    depends_on: *instance_depends
    environment:
      CHDASH_CONFIG_FILE: /config/chdash.hcl
    volumes:
      - type: bind
        source: ./config/privileges.hcl
        target: /config/chdash.hcl
        read_only: true
      - privileges_data:/data
    healthcheck: *instance_health

  chdash_system_disabled:
    profiles: ["test"]
    image: chdash-tests-source:local
    container_name: chdash-tests-system-disabled
    restart: unless-stopped
    stop_grace_period: 2s
    depends_on: *instance_depends
    environment:
      CHDASH_CONFIG_FILE: /config/chdash.hcl
    volumes:
      - type: bind
        source: ./config/system-disabled.hcl
        target: /config/chdash.hcl
        read_only: true
    healthcheck: *instance_health

  chdash_system_limits:
    profiles: ["test"]
    image: chdash-tests-source:local
    container_name: chdash-tests-system-limits
    restart: unless-stopped
    stop_grace_period: 2s
    depends_on: *instance_depends
    environment:
      CHDASH_CONFIG_FILE: /config/chdash.hcl
    volumes:
      - type: bind
        source: ./config/system-limits.hcl
        target: /config/chdash.hcl
        read_only: true
    healthcheck: *instance_health

  # The same server built with the files embedded in the binary (CHDASH_EMBED_STATIC=ON, the way the release is built):
  # no ./static, a map of versions in every page, .gz copies, long-lived caching of a versioned file. chdash_source
  # reads its files from the disk and never takes this path. The browser tests run on both (the `tests` service:
  # the frontend-embedded phase of run-all-tests.py). Run alone: `docker compose --profile embedded up -d --wait
  # chdash_embedded`, then Playwright with FRONTEND_BASE_URL=http://localhost:${EMBEDDED_PORT}.
  chdash_embedded:
    profiles: ["test", "embedded"]
    image: chdash-tests-embedded:local
    pull_policy: build
    build:
      context: ..
      dockerfile: ./tests/Dockerfile.source
      target: runtime-embedded
      args:
        CHDASH_SEMVER: "${SOURCE_SEMVER:-source-tests}"
        CHDASH_GIT_SHA: "${SOURCE_GIT_SHA:-local}"
        CHDASH_BUILD_TIME: "${SOURCE_BUILD_TIME:-docker-compose}"
        SOURCE_CMAKE_BUILD_TYPE: "${SOURCE_CMAKE_BUILD_TYPE:-Release}"
    container_name: chdash-tests-embedded
    restart: unless-stopped
    stop_grace_period: 2s
    depends_on:
      clickhouse:
        condition: service_healthy
        restart: false
    environment:
      CHDASH_CONFIG_FILE: /config/CH_HOSTS.hcl
    volumes:
      - type: bind
        source: ${CH_HOSTS_SOURCE_CONFIG:-./config/CH_HOSTS.local.hcl}
        target: /config/CH_HOSTS.hcl
        read_only: true
    ports:
      - "${EMBEDDED_PORT:-18081}:8080"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          wget -q -O - http://127.0.0.1:8080/api/version | grep -q '"name":"clickhouse-dash"'
      interval: 2s
      timeout: 2s
      retries: 120
      start_period: 2s

  # Single one-shot test container. It runs these phases, then exits: backend-functional, frontend-functional,
  # frontend-timing, frontend-embedded (the same browser tests on chdash_embedded), performance and design.
  tests:
    image: chdash-tests-all:local
    profiles: ["test"]
    build:
      context: .
      dockerfile: Dockerfile.tests
    container_name: chdash-tests-all
    restart: "no"
    depends_on:
      clickhouse:
        condition: service_healthy
      clickhouse_replica:
        condition: service_healthy
      chdash_source:
        condition: service_healthy
      chdash_embedded:
        condition: service_healthy
      chdash_mcp:
        condition: service_healthy
      chdash_qlib:
        condition: service_healthy
      chdash_otel_hosts:
        condition: service_healthy
      chdash_traces_allowlist:
        condition: service_healthy
      chdash_privileges:
        condition: service_healthy
      chdash_system_disabled:
        condition: service_healthy
      chdash_system_limits:
        condition: service_healthy
      otel_fixture:
        condition: service_healthy
    environment:
      API_BASE_URL: http://chdash_source:8080
      API_HEALTH_PATH: /api/health
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: "${CLICKHOUSE_USER:-test}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD:-test}"
      FRONTEND_BASE_URL: http://chdash_source:8080
      EMBEDDED_BASE_URL: http://chdash_embedded:8080
      MCP_CONTRACT_BASE_URL: http://chdash_mcp:8080
      QUERY_LIBRARY_LIVE_URL: http://chdash_qlib:8080
      OTEL_HOSTS_BASE_URL: http://chdash_otel_hosts:8080
      TRACES_ALLOWLIST_BASE_URL: http://chdash_traces_allowlist:8080
      PRIVILEGES_BASE_URL: http://chdash_privileges:8080
      SYSTEM_DISABLED_BASE_URL: http://chdash_system_disabled:8080
      SYSTEM_LIMITS_BASE_URL: http://chdash_system_limits:8080
      CHDASH_REQUIRE_FIXTURES: "1"
      TEST_ARTIFACTS_ROOT: /artifacts
      PERF_RUNS: "${PERF_RUNS:-20}"
      PERF_WARMUP: "${PERF_WARMUP:-1}"
      VISUAL_COMPARE: "${VISUAL_COMPARE:-1}"
    volumes:
      - type: bind
        source: ./artifacts
        target: /artifacts
      - type: bind
        source: ./frontend/snapshots
        target: /work/frontend/snapshots
      - type: bind
        source: ..
        target: /repo
        read_only: true
    ipc: host
    shm_size: "1gb"

volumes:
  clickhouse_data:
  clickhouse_replica_data:
  mcp_data:
  privileges_data:
  qlib_data:
