name: Conformance

# The conformance runner of ProcurAuth (access-conformance, role pep) against the release binary of ChDash (docs/conformance.md).
# The job builds the binary as the release does, and runs tests/conformance/run.sh. The script fails only for a failed case that
# tests/conformance/expected.txt does not list.
# The ProcurAuth repository is public: the job checks it out without a secret.
# The expected result (2026-11-12), for each of the three variants: 117 cases, 116 passed, 0 failed, 1 skipped. tests/conformance/expected.txt is empty.
# The job checks out one fixed commit of ProcurAuth (the `ref` below), so a change of the runner never changes the result alone.
# To bump it: run tests/conformance/run.sh with PROCURAUTH_DIR on the new commit and CONFORMANCE_STRICT=1, update expected.txt, then put the
# full SHA of the new commit in `ref` and in docs/conformance.md ("The commit of the runner").
# On request (Actions > Conformance > Run workflow), and on a pull request that changes the access code or the files of the run.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/access_*.cpp"
      - "src/access_*.hpp"
      - "src/server_access.cpp"
      - "src/api_resources.cpp"
      - "src/api_mcp.cpp"
      - "src/mcp_*.cpp"
      - "src/mcp_*.hpp"
      - "src/pdp_transport.cpp"
      - "src/config_keys.def"
      - "tests/conformance/**"
      - "tests/config/access.conformance*.hcl"
      - ".github/workflows/conformance.yml"

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    name: ProcurAuth runner against ChDash (linux amd64)
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - name: Checkout ChDash
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Checkout ProcurAuth
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          repository: SCcagg5/procurauth
          # ProcurAuth main of 2026-11-13 (lots S7 and PS1, merged): the runner with Mcp-Method and Mcp-Name, the rule of
          # use_ceiling (U37), the cases of the approvals for each action (U30 and U100 to U117, the profile key approval_calls),
          # and context.permission_only for the other permissions (protocol 5.5a, the cases U34, U35, D95, D96).
          ref: 1bdfe6199209b80e828b4cffd6e9d3052289f775
          path: procurauth
          persist-credentials: false

      - name: Build the release binary
        run: |
          docker build -f tests/smoke/Dockerfile.release --target binary \
            --output type=local,dest=conformance-out .
          file conformance-out/chdash

      - name: Run the conformance cases
        env:
          PROCURAUTH_DIR: ${{ github.workspace }}/procurauth
        run: tests/conformance/run.sh conformance-out/chdash

      # The document of the actions depends on the configuration: the run of the variants checks that each published action has a call in the profile.
      - name: Run the conformance cases, variant full (a writable library, the traces on)
        env:
          PROCURAUTH_DIR: ${{ github.workspace }}/procurauth
          CONFORMANCE_CONFIG: ${{ github.workspace }}/tests/config/access.conformance-full.hcl
          CONFORMANCE_PROFILE: ${{ github.workspace }}/tests/conformance/profile-full.json
        run: tests/conformance/run.sh conformance-out/chdash

      - name: Run the conformance cases, variant lean (no write account, no usage)
        env:
          PROCURAUTH_DIR: ${{ github.workspace }}/procurauth
          CONFORMANCE_CONFIG: ${{ github.workspace }}/tests/config/access.conformance-lean.hcl
          CONFORMANCE_PROFILE: ${{ github.workspace }}/tests/conformance/profile-lean.json
        run: tests/conformance/run.sh conformance-out/chdash
