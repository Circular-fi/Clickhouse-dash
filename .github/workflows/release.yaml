name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, ex: v2.7.10"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve tag/version
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "${TAG}" ]; then
            echo "Missing release tag"
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}"
            echo "Expected format: v2.7.10"
            exit 1
          fi

          VERSION="${TAG#v}"

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${TAG}"
          echo "Resolved version: ${VERSION}"

      - name: Ensure tag exists for manual release
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          TAG="${{ steps.vars.outputs.tag }}"

          git fetch --tags --force

          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists"
          else
            echo "Creating tag ${TAG} on the selected workflow commit"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "${TAG}"
            git push origin "refs/tags/${TAG}"
          fi

  build:
    name: Build (${{ matrix.goos }} ${{ matrix.goarch }})
    needs: prepare
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64

          - runner: macos-latest
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.tag }}

      - name: Compute build metadata
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ needs.prepare.outputs.version }}"
          GIT_SHA="$(git rev-parse HEAD)"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_DIR="build-${{ matrix.goos }}-${{ matrix.goarch }}"

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "git_sha=${GIT_SHA}" >> "${GITHUB_OUTPUT}"
          echo "build_time=${BUILD_TIME}" >> "${GITHUB_OUTPUT}"
          echo "build_dir=${BUILD_DIR}" >> "${GITHUB_OUTPUT}"

          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "GIT_SHA=${GIT_SHA}" >> "${GITHUB_ENV}"
          echo "BUILD_TIME=${BUILD_TIME}" >> "${GITHUB_ENV}"
          echo "BUILD_DIR=${BUILD_DIR}" >> "${GITHUB_ENV}"

      - name: Install deps (Linux)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            ca-certificates \
            cmake \
            git \
            lld \
            ninja-build

      - name: Install deps (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          brew update
          brew install ninja cmake

      - name: Cache CMake FetchContent deps
        uses: actions/cache@v5
        with:
          path: |
            ${{ steps.vars.outputs.build_dir }}/_deps
          key: cmake-fetchcontent-${{ matrix.goos }}-${{ matrix.goarch }}-${{ hashFiles('src/CMakeLists.txt', 'src/EmbedStatic.cmake') }}
          restore-keys: |
            cmake-fetchcontent-${{ matrix.goos }}-${{ matrix.goarch }}-

      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          EXTRA=()

          if [ "${{ matrix.goos }}" = "linux" ]; then
            EXTRA+=("-DCMAKE_EXE_LINKER_FLAGS=-s -fuse-ld=lld -static-libstdc++ -static-libgcc")
          fi

          if [ "${{ matrix.goos }}" = "darwin" ]; then
            if [ "${{ matrix.goarch }}" = "amd64" ]; then
              EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=x86_64")
            else
              EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=arm64")
            fi
          fi

          cmake -S src -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCHDASH_EMBED_STATIC=ON \
            -DCHDASH_SEMVER_VALUE="${VERSION}" \
            -DCHDASH_GIT_SHA_VALUE="${GIT_SHA}" \
            -DCHDASH_BUILD_TIME_VALUE="${BUILD_TIME}" \
            "${EXTRA[@]}"

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cmake --build "${BUILD_DIR}" --target chdash -- -j"$(getconf _NPROCESSORS_ONLN)"

      - name: Inspect binary
        shell: bash
        run: |
          set -euo pipefail
          test -f "${BUILD_DIR}/chdash"
          chmod +x "${BUILD_DIR}/chdash"
          file "${BUILD_DIR}/chdash" || true
          if [ "${{ matrix.goos }}" = "linux" ]; then
            ldd "${BUILD_DIR}/chdash" || true
          fi

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAR="chdash_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          BIN="${BUILD_DIR}/chdash"

          test -f "${BIN}"
          mkdir -p pkg
          cp "${BIN}" pkg/chdash
          tar -C pkg -czf "${TAR}" chdash
          echo "tar=${TAR}" >> "${GITHUB_OUTPUT}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: chdash_${{ steps.vars.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ steps.package.outputs.tar }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Flatten + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f -name "*.tar.gz" -exec cp {} out/ \;
          (cd out && sha256sum *.tar.gz > SHA256SUMS)
          ls -la out

      - name: Publish Release (generated notes)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
          files: |
            out/*.tar.gz
            out/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
