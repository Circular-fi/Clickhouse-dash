name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }} ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64

          # macOS
          - runner: macos-latest
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version (strip leading v)
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ---- Dependencies ----
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              libc6-dev-arm64-cross
          fi

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja

      - name: Tool versions
        run: |
          cmake --version
          ninja --version

      # ---- Configure ----
      - name: Configure
        shell: bash
        run: |
          set -euo pipefail

          EXTRA=()

          # macOS arch selection
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            if [ "${{ matrix.goarch }}" = "amd64" ]; then
              EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=x86_64")
            else
              EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=arm64")
            fi
          fi

          # Linux arm64 cross-compile
          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            EXTRA+=(
              "-DCMAKE_SYSTEM_NAME=Linux"
              "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
              "-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc"
              "-DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++"
            )
          fi

          cmake -S src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "${EXTRA[@]}"

      - name: Build
        run: cmake --build build --target chdash

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          TAR="chdash_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"

          if [ ! -f build/chdash ]; then
            echo "binary not found" >&2
            exit 1
          fi
          tar -C build -czf "$TAR" chdash
          echo "tar=$TAR" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-dash_${{ steps.vars.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ steps.package.outputs.tar }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten
        run: |
          mkdir -p out
          find dist -type f -name "*.tar.gz" -exec cp {} out/ \;

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}