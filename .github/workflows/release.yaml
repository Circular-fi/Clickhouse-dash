name: Release

# A release builds the tagged commit, checks and smoke-tests each binary, then publishes the archives
# with SHA256SUMS and a signed build provenance attestation (gh attestation verify <archive> --repo
# <owner>/<repo>). It runs no test suite (that took more than an hour): the full suite runs before the
# tag is made (tests/README.md) and on request (Actions > CI > Run workflow).
#
# Supply chain: every action is pinned by commit SHA (Dependabot updates the pins), no job restores a
# cache, no checkout keeps the token in .git/config, and only the last job may write to the repository.
# The "release" environment of that job can require a reviewer (repository settings, Environments).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, ex: v2.7.10"
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
      version: ${{ steps.vars.outputs.version }}
      sha: ${{ steps.vars.outputs.sha }}
    steps:
      # The tag is a value of the shell (env), never text of the script: it is checked before any use.
      # A manual run builds the commit of an existing tag, or else the commit it was started on (the tag
      # is created on it when the release is published).
      - name: Resolve tag, version and commit
        id: vars
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            TAG="${INPUT_TAG}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi

          if [ -z "${TAG}" ]; then
            echo "Missing release tag"
            exit 1
          fi

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: ${TAG}"
            echo "Expected format: v2.7.10"
            exit 1
          fi

          VERSION="${TAG#v}"
          SHA="${GITHUB_SHA}"
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            if REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}" 2>&1)"; then
              SHA="$(jq -r .object.sha <<< "${REF}")"
              if [ "$(jq -r .object.type <<< "${REF}")" = "tag" ]; then
                SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA}" --jq .object.sha)"
              fi
              echo "Tag ${TAG} exists: building ${SHA}"
            elif grep -q "HTTP 404" <<< "${REF}"; then
              echo "Tag ${TAG} does not exist: building ${SHA}, the tag is created on publish"
            else
              echo "Cannot read tag ${TAG}: ${REF}"
              exit 1
            fi
          fi
          if [[ ! "${SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid commit: ${SHA}"
            exit 1
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "sha=${SHA}"
          } >> "${GITHUB_OUTPUT}"
          echo "Resolved release tag: ${TAG}"
          echo "Resolved version: ${VERSION}"

  build:
    name: Build (${{ matrix.goos }} ${{ matrix.goarch }})
    needs: prepare
    permissions:
      contents: read
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            zig_target: x86_64-linux-musl
            cmake_processor: x86_64
            build_jobs: 2

          - runner: ubuntu-22.04-arm
            goos: linux
            goarch: arm64
            zig_target: aarch64-linux-musl
            cmake_processor: aarch64
            build_jobs: 2

          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            osx_arch: x86_64
            build_jobs: 2

          - runner: macos-15
            goos: darwin
            goarch: arm64
            osx_arch: arm64
            build_jobs: 2

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - name: Compute build metadata
        id: vars
        shell: bash
        run: |
          set -euo pipefail

          VERSION="${{ needs.prepare.outputs.version }}"
          GIT_SHA="$(git rev-parse HEAD)"
          test "${GIT_SHA}" = "${{ needs.prepare.outputs.sha }}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          BUILD_DIR="build-${{ matrix.goos }}-${{ matrix.goarch }}"
          FETCHCONTENT_DIR="${RUNNER_TEMP}/fetchcontent-${{ matrix.goos }}-${{ matrix.goarch }}"
          BUILD_JOBS="${{ matrix.build_jobs }}"

          {
            echo "version=${VERSION}"
            echo "git_sha=${GIT_SHA}"
            echo "build_time=${BUILD_TIME}"
            echo "build_dir=${BUILD_DIR}"
            echo "fetchcontent_dir=${FETCHCONTENT_DIR}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "VERSION=${VERSION}"
            echo "GIT_SHA=${GIT_SHA}"
            echo "BUILD_TIME=${BUILD_TIME}"
            echo "BUILD_DIR=${BUILD_DIR}"
            echo "FETCHCONTENT_DIR=${FETCHCONTENT_DIR}"
            echo "BUILD_JOBS=${BUILD_JOBS}"
          } >> "${GITHUB_ENV}"

          if [ "${{ matrix.goos }}" = "linux" ]; then
            echo "ZIG_TARGET=${{ matrix.zig_target }}" >> "${GITHUB_ENV}"
          fi

      - name: Install dependencies (Linux)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            ca-certificates \
            cmake \
            file \
            git \
            ninja-build \
            python3

      - name: Install dependencies (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          brew list --versions cmake >/dev/null 2>&1 || brew install cmake
          brew list --versions ninja >/dev/null 2>&1 || brew install ninja

      # setup-zig checks the minisign signature of the Zig archive. No cache: a release builds from scratch.
      - name: Set up Zig (Linux musl toolchain)
        if: matrix.goos == 'linux'
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: 0.15.2
          use-cache: false

      - name: Create Zig musl CMake toolchain
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          TOOLS_DIR="${PWD}/.github-build-tools/${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "${TOOLS_DIR}"

          cat > "${TOOLS_DIR}/zig-cc" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec zig cc -target "${ZIG_TARGET}" -static "$@"
          EOF

          cat > "${TOOLS_DIR}/zig-cxx" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec zig c++ -target "${ZIG_TARGET}" -static "$@"
          EOF

          cat > "${TOOLS_DIR}/zig-ar" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec zig ar "$@"
          EOF

          cat > "${TOOLS_DIR}/zig-ranlib" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          exec zig ranlib "$@"
          EOF

          sed -i 's/^          //' \
            "${TOOLS_DIR}/zig-cc" \
            "${TOOLS_DIR}/zig-cxx" \
            "${TOOLS_DIR}/zig-ar" \
            "${TOOLS_DIR}/zig-ranlib"
          chmod +x \
            "${TOOLS_DIR}/zig-cc" \
            "${TOOLS_DIR}/zig-cxx" \
            "${TOOLS_DIR}/zig-ar" \
            "${TOOLS_DIR}/zig-ranlib"

          TOOLCHAIN_FILE="${TOOLS_DIR}/zig-musl-toolchain.cmake"
          cat > "${TOOLCHAIN_FILE}" <<EOF
          set(CMAKE_SYSTEM_NAME Linux)
          set(CMAKE_SYSTEM_PROCESSOR ${{ matrix.cmake_processor }})
          set(CMAKE_C_COMPILER "${TOOLS_DIR}/zig-cc")
          set(CMAKE_CXX_COMPILER "${TOOLS_DIR}/zig-cxx")
          set(CMAKE_AR "${TOOLS_DIR}/zig-ar")
          set(CMAKE_RANLIB "${TOOLS_DIR}/zig-ranlib")
          set(CMAKE_TRY_COMPILE_TARGET_TYPE STATIC_LIBRARY)
          set(CMAKE_FIND_LIBRARY_SUFFIXES ".a")
          set(BUILD_SHARED_LIBS OFF CACHE BOOL "" FORCE)
          set(CMAKE_POSITION_INDEPENDENT_CODE ON CACHE BOOL "" FORCE)
          set(CMAKE_EXE_LINKER_FLAGS_INIT "-static -pie")
          EOF
          sed -i 's/^          //' "${TOOLCHAIN_FILE}"

          echo "ZIG_TOOLCHAIN_FILE=${TOOLCHAIN_FILE}" >> "${GITHUB_ENV}"

      - name: Configure (Linux musl static)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${BUILD_DIR}"

          cmake -S src -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${ZIG_TOOLCHAIN_FILE}" \
            -DCHDASH_EMBED_STATIC=ON \
            -DCHDASH_SEMVER_VALUE="${VERSION}" \
            -DCHDASH_GIT_SHA_VALUE="${GIT_SHA}" \
            -DCHDASH_BUILD_TIME_VALUE="${BUILD_TIME}" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_DIR}"

          grep -E 'CMAKE_(C|CXX)_COMPILER(:|=)' "${BUILD_DIR}/CMakeCache.txt" || true

      - name: Configure (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "${BUILD_DIR}"

          cmake -S src -B "${BUILD_DIR}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="${{ matrix.osx_arch }}" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCHDASH_EMBED_STATIC=ON \
            -DCHDASH_SEMVER_VALUE="${VERSION}" \
            -DCHDASH_GIT_SHA_VALUE="${GIT_SHA}" \
            -DCHDASH_BUILD_TIME_VALUE="${BUILD_TIME}" \
            -DFETCHCONTENT_BASE_DIR="${FETCHCONTENT_DIR}"

          grep -E 'CMAKE_(C|CXX)_COMPILER(:|=)|CMAKE_OSX_ARCHITECTURES' "${BUILD_DIR}/CMakeCache.txt" || true

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          BUILD_LOG="${BUILD_DIR}/build.log"

          set +e
          cmake --build "${BUILD_DIR}" --target chdash --parallel "${BUILD_JOBS}" 2>&1 | tee "${BUILD_LOG}"
          BUILD_STATUS=${PIPESTATUS[0]}
          set -e

          if [ "${BUILD_STATUS}" -ne 0 ]; then
            echo "::group::Last 300 build-log lines"
            tail -n 300 "${BUILD_LOG}" || true
            echo "::endgroup::"
            exit "${BUILD_STATUS}"
          fi

      - name: Upload build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-diagnostics-${{ matrix.goos }}-${{ matrix.goarch }}
          path: |
            ${{ env.BUILD_DIR }}/build.log
            ${{ env.BUILD_DIR }}/CMakeCache.txt
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeError.log
            ${{ env.BUILD_DIR }}/CMakeFiles/CMakeOutput.log
          if-no-files-found: ignore
          retention-days: 14

      # Static, position independent (static-pie), with the stack protector: checked before the strip,
      # which removes the symbols that show the stack protector.
      - name: Verify and strip the Linux binary
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          file "${BUILD_DIR}/chdash"
          tests/smoke/check_release_binary.sh "${BUILD_DIR}/chdash"
          strip "${BUILD_DIR}/chdash"

      # The test image is not the shipped binary: start this one with every page enabled and probe the
      # routes that must answer. It runs on the runner of the binary (linux and darwin, amd64 and arm64).
      - name: Smoke test the binary
        shell: bash
        run: |
          set -euo pipefail
          python3 tests/smoke/release_smoke.py --binary "${BUILD_DIR}/chdash"

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAR="chdash_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"
          BIN="${BUILD_DIR}/chdash"

          test -f "${BIN}"
          rm -rf pkg
          mkdir -p pkg
          cp "${BIN}" pkg/chdash
          tar -C pkg -czf "${TAR}" chdash
          echo "tar=${TAR}" >> "${GITHUB_OUTPUT}"

      - name: Upload release asset
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chdash_${{ steps.vars.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ steps.package.outputs.tar }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist

      - name: Flatten + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f -name "*.tar.gz" -exec cp {} out/ \;
          (cd out && sha256sum -- *.tar.gz > SHA256SUMS)
          ls -la out

      - name: Verify Linux release assets before publishing
        shell: bash
        run: |
          set -euo pipefail

          shopt -s nullglob
          linux_assets=(out/*_linux_*.tar.gz)

          if [ "${#linux_assets[@]}" -eq 0 ]; then
            echo "ERROR: no Linux assets found"
            exit 1
          fi

          for asset in "${linux_assets[@]}"; do
            echo "Checking ${asset}"
            tmp="$(mktemp -d)"
            tar -C "${tmp}" -xzf "${asset}"
            test -f "${tmp}/chdash"
            file "${tmp}/chdash"

            if readelf -l "${tmp}/chdash" | grep -q 'INTERP' || readelf -d "${tmp}/chdash" | grep -q '(NEEDED)'; then
              echo "ERROR: ${asset} contains a dynamically linked binary"
              exit 1
            fi
            if ! readelf -h "${tmp}/chdash" | grep -Eq 'Type:[[:space:]]+DYN'; then
              echo "ERROR: ${asset} is not position independent (static-pie expected)"
              exit 1
            fi

            rm -rf "${tmp}"
          done

      # A signed statement, kept by GitHub, that this workflow built these archives from this commit.
      # It does not live in the release, so a changed archive and SHA256SUMS cannot carry it along.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: out/*.tar.gz

      # gh, not a third-party action, holds the write token. A manual run creates the tag here, on the
      # commit that was tested and built. A re-run uploads the assets again (--clobber).
      - name: Publish Release (generated notes)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          set -euo pipefail
          if REF="$(gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" 2>&1)"; then
            TAG_SHA="$(jq -r .object.sha <<< "${REF}")"
            if [ "$(jq -r .object.type <<< "${REF}")" = "tag" ]; then
              TAG_SHA="$(gh api "repos/${GH_REPO}/git/tags/${TAG_SHA}" --jq .object.sha)"
            fi
            if [ "${TAG_SHA}" != "${SHA}" ]; then
              echo "ERROR: tag ${TAG} points to ${TAG_SHA}, the assets were built from ${SHA}"
              exit 1
            fi
          elif grep -q "HTTP 404" <<< "${REF}"; then
            echo "Creating tag ${TAG} on ${SHA}"
            gh api "repos/${GH_REPO}/git/refs" -f ref="refs/tags/${TAG}" -f sha="${SHA}" >/dev/null
          else
            echo "Cannot read tag ${TAG}: ${REF}"
            exit 1
          fi
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/*.tar.gz out/SHA256SUMS --clobber
          else
            gh release create "${TAG}" out/*.tar.gz out/SHA256SUMS --title "${TAG}" --generate-notes --verify-tag
          fi
