name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  build:
    name: Build (${{ matrix.goos }} ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64

          - runner: macos-latest
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute version (strip leading v)
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Set up QEMU
        if: matrix.goos == 'linux'
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        if: matrix.goos == 'linux'
        uses: docker/setup-buildx-action@v3

      - name: Build (Linux via Dockerfile target=production, cached)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build_out
          mkdir -p build_out

          docker buildx build             --platform "linux/${{ matrix.goarch }}"             -f test/Dockerfile             --target production             --cache-from type=gha             --cache-to type=gha,mode=max             --output "type=local,dest=build_out"             .

          test -f build_out/chdash
          chmod +x build_out/chdash
          file build_out/chdash || true

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja cmake

      - name: Cache CMake deps (macOS)
        if: matrix.goos == 'darwin'
        uses: actions/cache@v4
        with:
          path: |
            build/_deps
            build/CMakeCache.txt
          key: cmake-${{ runner.os }}-${{ matrix.goarch }}-${{ hashFiles('src/CMakeLists.txt', 'src/EmbedStatic.cmake') }}

      - name: Configure (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          set -euo pipefail

          EXTRA=()
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=x86_64")
          else
            EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=arm64")
          fi

          cmake -S src -B build -G Ninja             -DCMAKE_BUILD_TYPE=Release             -DCMAKE_POLICY_VERSION_MINIMUM=3.5             -DCHDASH_EMBED_STATIC=ON             "${EXTRA[@]}"

      - name: Build (macOS)
        if: matrix.goos == 'darwin'
        run: cmake --build build --target chdash -- -j2

      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          TAR="chdash_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"

          if [ "${{ matrix.goos }}" = "linux" ]; then
            BIN="build_out/chdash"
          else
            BIN="build/chdash"
          fi

          if [ ! -f "$BIN" ]; then
            echo "binary not found at $BIN" >&2
            exit 1
          fi

          mkdir -p pkg
          cp "$BIN" pkg/chdash
          tar -C pkg -czf "$TAR" chdash
          echo "tar=$TAR" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chdash_${{ steps.vars.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ steps.package.outputs.tar }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f -name "*.tar.gz" -exec cp {} out/ \;
          (cd out && sha256sum *.tar.gz > SHA256SUMS)
          ls -la out

      - name: Publish Release (generated notes)
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            out/*.tar.gz
            out/SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Publish Docker image (GHCR)
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (multi-arch)
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"

          docker buildx build             --platform linux/amd64,linux/arm64             -f test/Dockerfile             --target production             -t "${IMAGE}:${TAG}"             -t "${IMAGE}:latest"             --cache-from type=gha             --cache-to type=gha,mode=max             --push             .
