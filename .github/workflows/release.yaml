name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-amd64
          # macOS Intel runner to produce an amd64 (x86_64) binary.
          - os: macos-13
            name: macos-amd64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          # CMake is preinstalled on GitHub macOS runners.
          # Installing via Homebrew can upgrade to CMake 4.x, which breaks some deps (RapidJSON).
          brew install ninja

      - name: Tool versions
        run: |
          cmake --version
          ninja --version

      - name: Configure (CMake)
        run: cmake -S src -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build
        run: cmake --build build --target chdash

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME}"
          OUT="clickhouse-dash_${VERSION}_${{ matrix.name }}"

          rm -rf "$OUT"
          mkdir -p "$OUT"

          if [ -f build/chdash ]; then
            cp build/chdash "$OUT/"
          elif [ -f build/chdash.exe ]; then
            cp build/chdash.exe "$OUT/"
          else
            echo "binary not found" >&2
            ls -la build
            exit 1
          fi

          if [ -d src/static ]; then
            mkdir -p "$OUT/static"
            rsync -a src/static/ "$OUT/static/"
          fi

          [ -f README.md ] && cp README.md "$OUT/" || true
          [ -f LICENSE ] && cp LICENSE "$OUT/" || true

          tar -czf "${OUT}.tar.gz" "$OUT"

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            clickhouse-dash_${{ github.ref_name }}_${{ matrix.name }}.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
