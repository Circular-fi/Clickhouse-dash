name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }} ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (one runner, cross-compile for arm64)
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64

          # macOS (one runner, build both arch via CMAKE_OSX_ARCHITECTURES)
          - runner: macos-latest
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64

          # Windows (one runner, build both via -A x64/ARM64)
          - runner: windows-latest
            goos: windows
            goarch: amd64
          - runner: windows-latest
            goos: windows
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version (strip leading v)
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ---- deps / toolchain ----
      - name: Install deps (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake ninja-build
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            sudo apt-get install -y --no-install-recommends \
              gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
              libc6-dev-arm64-cross
          fi

      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew update
          # éviter d’installer cmake via brew (risque CMake 4.x)
          brew install ninja

      - name: MSVC dev cmd (Windows amd64)
        if: runner.os == 'Windows' && matrix.goarch == 'amd64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: MSVC dev cmd (Windows arm64)
        if: runner.os == 'Windows' && matrix.goarch == 'arm64'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64_arm64

      - name: Tool versions
        shell: bash
        run: |
          cmake --version

      # ---- configure/build ----
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail

          EXTRA=()
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            if [ "${{ matrix.goarch }}" = "amd64" ]; then
              EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=x86_64")
            else
              EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=arm64")
            fi
          fi

          if [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            EXTRA+=(
              "-DCMAKE_SYSTEM_NAME=Linux"
              "-DCMAKE_SYSTEM_PROCESSOR=aarch64"
              "-DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc"
              "-DCMAKE_CXX_COMPILER=aarch64-linux-gnu-g++"
            )
          fi

          cmake -S src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "${EXTRA[@]}"

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          cmake --build build --target chdash

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            ARCH="x64"
          else
            ARCH="ARM64"
          fi

          # VS generator avoids zstd/ASM MSVC_RUNTIME_LIBRARY issues with Ninja
          cmake -S src -B build \
            -G "Visual Studio 17 2022" -A "${ARCH}" \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cmake --build build --config Release --target chdash

      # ---- package ----
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          OUT="clickhouse-dash_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}"
          rm -rf "$OUT"
          mkdir -p "$OUT"

          BIN=""
          if [ -f build/chdash ]; then
            BIN="build/chdash"
          elif [ -f build/Release/chdash.exe ]; then
            BIN="build/Release/chdash.exe"
          elif [ -f build/chdash.exe ]; then
            BIN="build/chdash.exe"
          else
            echo "binary not found (expected build/chdash or build/Release/chdash.exe)" >&2
            find build -maxdepth 3 -type f -name "chdash*" -print || true
            exit 1
          fi

          cp "$BIN" "$OUT/"

          if [ -d src/static ]; then
            mkdir -p "$OUT/static"
            rsync -a src/static/ "$OUT/static/"
          fi

          [ -f README.md ] && cp README.md "$OUT/" || true
          [ -f LICENSE ] && cp LICENSE "$OUT/" || true

          TAR="${OUT}.tar.gz"
          cmake -E tar "cfvz" "$TAR" "$OUT"
          echo "tar=$TAR" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: clickhouse-dash_${{ steps.vars.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ steps.package.outputs.tar }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f -name "*.tar.gz" -exec cp {} out/ \;
          ls -la out

      - name: Create/Update GitHub Release and upload assets
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
