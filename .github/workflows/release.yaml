name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.goos }} ${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux (STATIC musl -> scratch compatible)
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64

          # macOS
          - runner: macos-latest
            goos: darwin
            goarch: amd64
          - runner: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute version (strip leading v)
        id: vars
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      # ---- Linux build (STATIC musl inside Alpine) ----
      - name: Build (Linux static musl)
        if: matrix.goos == 'linux'
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm \
            -v "$PWD":/work \
            -w /work \
            alpine:3.20 sh -euxc '
              apk add --no-cache build-base cmake ninja git ca-certificates

              cmake -S src -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
                -DCMAKE_EXE_LINKER_FLAGS="-static -static-libstdc++ -static-libgcc -s"

              cmake --build build --target chdash

              echo "== file =="
              file build/chdash

              echo "== ldd (should fail or say not a dynamic executable) =="
              ldd build/chdash || true
            '

      # ---- macOS deps ----
      - name: Install deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install ninja

      # ---- macOS configure/build ----
      - name: Configure (macOS)
        if: matrix.goos == 'darwin'
        shell: bash
        run: |
          set -euo pipefail

          EXTRA=()
          if [ "${{ matrix.goarch }}" = "amd64" ]; then
            EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=x86_64")
          else
            EXTRA+=("-DCMAKE_OSX_ARCHITECTURES=arm64")
          fi

          cmake -S src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            "${EXTRA[@]}"

      - name: Build (macOS)
        if: matrix.goos == 'darwin'
        run: cmake --build build --target chdash

      # ---- Package (chdash at archive root) ----
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail

          TAR="chdash_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.tar.gz"

          if [ ! -f build/chdash ]; then
            echo "binary not found at build/chdash" >&2
            exit 1
          fi

          # Put ONLY "chdash" at the root of the tar.gz
          tar -C build -czf "$TAR" chdash

          echo "tar=$TAR" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: chdash_${{ steps.vars.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}
          path: ${{ steps.package.outputs.tar }}
          if-no-files-found: error

  release:
    name: Publish GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Flatten
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          find dist -type f -name "*.tar.gz" -exec cp {} out/ \;
          ls -la out

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}