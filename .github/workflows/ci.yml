name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:
  # The release workflow runs this profile on the commit it builds (release.yaml, job "tests").
  workflow_call:
    inputs:
      ref:
        description: "Commit to test (default: the commit of the event)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    # The browser tests run twice, on the build that reads ./static and on the build with the files embedded.
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Check the WebAssembly kernels
        run: |
          python3 tools/build_wasm.py --verify
          python3 tools/build_wasm.py --docker --check

      # The pure modules of the frontend in a bare vm (tests/frontend/model, tests/harness/esm_vm.js): seconds, no
      # container. The harness runs the same files again inside the test container.
      - name: Node unit tests of the frontend modules
        run: node --experimental-vm-modules --no-warnings --test tests/frontend/model/*.test.cjs

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run single-container test profile
        run: |
          docker compose -f tests/docker-compose.yml --profile test up --build --abort-on-container-exit --exit-code-from tests

      - name: Upload combined analysis bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chdash-test-review
          path: |
            tests/artifacts/chdash-test-review.zip
            tests/artifacts/test-run/manifest.json
          if-no-files-found: ignore

      - name: Collect logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f tests/docker-compose.yml --profile test ps -a > artifacts/compose-ps.txt || true
          docker compose -f tests/docker-compose.yml --profile test logs --no-color > artifacts/compose.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-logs
          path: artifacts
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f tests/docker-compose.yml --profile test down -v --remove-orphans || true
