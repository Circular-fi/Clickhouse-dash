name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - '**'
    tags-ignore:
      - 'v*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Docker versions
        run: |
          docker --version
          docker compose version

      - name: Run single-container test profile
        run: |
          docker compose -f tests/docker-compose.yml --profile test up --build --abort-on-container-exit --exit-code-from tests

      - name: Upload combined analysis bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: chdash-test-review
          path: |
            tests/artifacts/chdash-test-review.zip
            tests/artifacts/test-run/manifest.json
          if-no-files-found: ignore

      - name: Collect logs
        if: always()
        run: |
          mkdir -p artifacts
          docker compose -f tests/docker-compose.yml --profile test ps -a > artifacts/compose-ps.txt || true
          docker compose -f tests/docker-compose.yml --profile test logs --no-color > artifacts/compose.log || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-logs
          path: artifacts
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f tests/docker-compose.yml --profile test down -v --remove-orphans || true
