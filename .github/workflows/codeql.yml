name: CodeQL

# Code scanning, not a test: once a week and on request, no longer on every push and pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: '20 4 * * 1'

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: c-cpp, python, actions
          queries: security-extended,security-and-quality

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++

      - name: Build C++ target
        run: |
          cmake -S src -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCHDASH_EMBED_STATIC=ON
          cmake --build build --target chdash -- -j2

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
