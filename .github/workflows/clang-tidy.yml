name: Static analysis

# On request only (Actions > run workflow): the tests are those of ci.yml, on request too.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: static-analysis-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handler-captures:
    name: Dangling captures in route handlers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No compiler warning and no clang-tidy check finds a [&] handler that calls a local lambda of
      # the Server constructor (v2.16.3). This script does (tools/check_handler_captures.py).
      - name: Check the capture lists of the handlers
        run: python3 tools/check_handler_captures.py src/server.cpp

  clang-tidy:
    name: clang-tidy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # A pull request that changes only some .cpp files checks those files. A change to a header, to
      # the build files or to .clang-tidy, and every push to main, the weekly run and a manual run
      # check all of src/*.cpp. The file names come from the pull request: they reach the shell as data
      # (env, then an array), never as text of the script, and a name outside [A-Za-z0-9_./-] stops the job.
      - name: Choose the files
        id: files
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          files=""
          if [ "${EVENT_NAME}" = "pull_request" ]; then
            changed="$(git diff --name-only "origin/${BASE_REF}...HEAD" --)"
            if ! grep -qE '^(src/.*\.hpp|src/CMakeLists\.txt|src/BuildFlags\.cmake|\.clang-tidy|tests/tools/clang-tidy\.sh|tests/Dockerfile\.sanitize|\.github/workflows/clang-tidy\.yml)$' <<< "${changed}"; then
              cpp="$(grep -E '^src/.*\.cpp$' <<< "${changed}" || true)"
              if grep -qvE '^src/[A-Za-z0-9_./-]+\.cpp$' <<< "${cpp:-src/x.cpp}"; then
                echo "A changed C++ file has a name outside [A-Za-z0-9_./-]:"
                grep -vE '^src/[A-Za-z0-9_./-]+\.cpp$' <<< "${cpp}" | head -5
                exit 1
              fi
              files="$(while read -r f; do [ -n "$f" ] && [ -f "$f" ] && echo "$f"; done <<< "${cpp}" | tr '\n' ' ' || true)"
              if [ -z "${files}" ]; then
                echo "No C++ source changed: nothing to analyze."
                echo "skip=true" >> "${GITHUB_OUTPUT}"
              fi
            fi
          fi
          echo "files=${files}" >> "${GITHUB_OUTPUT}"
          echo "Files: ${files:-all of src/*.cpp}"

      - name: Run clang-tidy
        if: steps.files.outputs.skip != 'true'
        env:
          FILES: ${{ steps.files.outputs.files }}
        run: |
          read -r -a files <<< "${FILES}"
          tests/tools/clang-tidy.sh "${files[@]}"
