<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ClickHouse Dash · Metrics</title>
  <script>
    (function () {
      try {
        var pathname = String(window.location.pathname || "/");
        var marker = pathname.indexOf("/observability");
        if (marker < 0) marker = pathname.indexOf("/explorer");
        if (marker < 0) marker = pathname.indexOf("/query");
        var prefix = marker >= 0 ? pathname.slice(0, marker) : pathname.replace(/\/+$/g, "");
        if (!prefix || prefix === "/") prefix = "";
        var appBase = (prefix ? prefix : "") + "/";
        window.__CHDASH_BASE_PATH__ = appBase;
        window.__chdashUrl = function (path) {
          var raw = String(path || "");
          if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.startsWith("//")) return raw;
          var rel = raw.replace(/^\/+/, "");
          // A script or stylesheet of this binary has its content hash (the staged shells carry the map,
          // tools/stage_static.py): the address never changes content, so the browser keeps it.
          var hash = window.__chdashAssetVersions && window.__chdashAssetVersions[rel];
          return appBase + rel + (hash ? "?v=" + hash : "");
        };
        // The page switcher is part of the page shell and never waits on
        // /api/version. Only a server that last reported no other page hides it,
        // before the first paint. The same last answer says which views
        // (Traces, Logs, Metrics) have a tab.
        var pageNav = null;
        try {
          pageNav = JSON.parse(localStorage.getItem("chdash.pageNav.v1") || "null");
          if (pageNav && pageNav.explorer === false && pageNav.system === false && pageNav.traces !== true && pageNav.logs !== true && pageNav.metrics !== true && pageNav.mcp !== true) {
            document.documentElement.classList.add("chdash-page-select-hidden");
          }
        } catch (_) {}
        // This page is one view: the tabs of the row link to the others, and the ones the server
        // last reported turned off are hidden before the first paint.
        var views = ["traces", "logs", "metrics"];
        var enabled = views.filter(function (name) { return !pageNav || pageNav[name] === true; });
        if (!enabled.length) enabled = views;
        var view = "metrics";
        document.documentElement.dataset.obsView = view;
        document.documentElement.dataset.obsEnabled = enabled.join(" ");
        document.title = "ClickHouse Dash · Metrics";
        // Written by the parser, not appended: a script-appended <link> does not
        // block rendering, so the shell would first paint unstyled (native
        // selects, plain buttons) and restyle once the stylesheet lands.
        var cssHref = window.__chdashUrl("static/style.metrics.css").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        document.write('<link rel="stylesheet" href="' + cssHref + '">');
        var favicon = document.createElement("link");
        favicon.rel = "icon"; favicon.type = "image/svg+xml";
        favicon.href = window.__chdashUrl("static/images/logo.svg");
        document.head.appendChild(favicon);
        var fallbackIcon = document.createElement("link");
        fallbackIcon.rel = "alternate icon"; fallbackIcon.sizes = "any";
        fallbackIcon.href = window.__chdashUrl("static/images/favicon.ico");
        document.head.appendChild(fallbackIcon);
        var mode = localStorage.getItem("chdash.theme");
        if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
        if (mode === "dark" || mode === "light") document.documentElement.dataset.theme = mode;
        else delete document.documentElement.dataset.theme;
        document.documentElement.dataset.themeMode = mode;
        // The side panels (Traces Attributes, Logs Fields, the Metrics
        // catalog) keep their open / folded state from the first paint, each
        // its own (the facets fold by default on narrow windows).
        try {
          // [store key, <html> class, folded by default below 1100 px]
          var facetRails = [["chdash.traceFacetsCollapsed.v1", "chdash-trace-facets-collapsed", true], ["chdash.logsFacetsCollapsed.v1", "chdash-logs-facets-collapsed", true], ["chdash.metricsCatalogCollapsed.v1", "chdash-metrics-catalog-collapsed", false]];
          for (var f = 0; f < facetRails.length; f += 1) {
            var facets = localStorage.getItem(facetRails[f][0]);
            if (facets === "1" || (facetRails[f][2] && facets !== "0" && window.innerWidth < 1100)) {
              document.documentElement.classList.add(facetRails[f][1]);
            }
          }
        } catch (_) {}
        window.__chdashEarlyState = { themeMode: mode, obsView: view };
      } catch (_) {}
    })();
  </script>
  <!-- shell:fonts -->
  <!-- Generated by tools/build_page_css.py from tools/page_shells.py (FONT_PRELOADS): edit it there, then rerun the script. -->
  <script>
    (function () {
      if (!window.__chdashUrl) return;
      // The icon sprite (tools/icons.py): a new drawing is a new address.
      window.__chdashIconSprite = window.__chdashUrl("static/icons.svg?v=b9b85fc46d");
      // Parsed right after the stylesheet link, so the fonts download with it.
      var fonts = ["IBMPlexSans-Regular-Latin1.woff2", "IBMPlexSans-Medium-Latin1.woff2", "IBMPlexMono-Regular-Latin1.woff2"];
      for (var i = 0; i < fonts.length; i += 1) {
        var href = window.__chdashUrl("static/fonts/" + fonts[i]).replace(/&/g, "&amp;").replace(/"/g, "&quot;");

<body data-page="observability">
  <!-- shell:header -->
  <!-- Generated by tools/build_page_css.py from src/shell/header.html: edit it there, then rerun the script. -->
  <header class="appHeader" role="banner">
    <div class="appHeader__left">
      <div class="appBrand">
        <svg class="appBrand__logo" viewBox="0 0 18 18" aria-hidden="true"><rect x="0.75" y="10.5" width="3" height="6" rx="1"/><rect x="5.25" y="5.5" width="3" height="11" rx="1"/><rect x="9.75" y="8" width="3" height="8.5" rx="1"/><rect x="14.25" y="1.5" width="3" height="15" rx="1"/></svg>
        <span class="appBrand__name">ClickHouse Dash</span>
        <span id="versionBadge" class="versionBadge" title="Backend version">--</span>
      </div>
    </div>
    <div class="appHeader__right">
      <div id="hostPicker" class="picker" aria-label="Target host">
        <button
          id="hostPickerButton"
          class="button picker__button"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          title="Target host">
          <span id="hostPickerDot" class="hostDot hostDot--bad" aria-hidden="true"></span>
          <span id="hostPickerText" class="picker__text">Host</span>
          <span id="hostPickerVersion" class="hostVersion" aria-label="clickhouse version"></span>
          <span id="hostPickerPing" class="hostPing" aria-label="ping"></span>
        </button>
        <div id="hostPickerMenu" class="picker__menu" role="listbox" tabindex="-1" hidden></div>
      </div>
      <div id="pageSelect" class="themeSelect pageSelect" aria-label="Page">
        <button id="pageSelectButton" class="button themeSelect__button pageSelect__button" type="button" aria-haspopup="listbox" aria-expanded="false">Observability</button>
        <div id="pageSelectMenu" class="themeSelect__menu pageSelect__menu" role="listbox" tabindex="-1" hidden>
          <button id="navQueryButton" class="themeSelect__option" type="button" role="option" data-value="query" aria-selected="false">Query</button>
          <button id="navExplorerButton" class="themeSelect__option" type="button" role="option" data-value="explorer" aria-selected="false">Explorer</button>
          <button id="navObservabilityButton" class="themeSelect__option" type="button" role="option" data-value="observability" aria-selected="true">Observability</button>
          <button id="navSystemButton" class="themeSelect__option" type="button" role="option" data-value="system" aria-selected="false">System</button>
          <button id="navMcpButton" class="themeSelect__option" type="button" role="option" data-value="mcp" aria-selected="false" hidden>MCP</button>
        </div>
      </div>
      <div id="themeSelect" class="themeSelect themeSelect--icons" aria-label="Theme">
        <button
          id="themeSelectButton"
          class="button themeSelect__button themeSelect__button--icon"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-label="Theme: system"
          title="Theme">
          <span id="themeSelectText" class="themeSelect__current" aria-hidden="true"><svg class="icon icon--lg themeIcon themeIcon--system" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-device-desktop"/></svg><svg class="icon icon--lg themeIcon themeIcon--dark" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-moon"/></svg><svg class="icon icon--lg themeIcon themeIcon--light" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-sun"/></svg></span>
        </button>
        <div id="themeSelectMenu" class="themeSelect__menu themeSelect__menu--icons" role="listbox" tabindex="-1" hidden>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="system" aria-label="System theme" title="System" aria-selected="true"><svg class="icon icon--lg themeIcon themeIcon--system" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-device-desktop"/></svg></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="dark" aria-label="Dark theme" title="Dark" aria-selected="false"><svg class="icon icon--lg themeIcon themeIcon--dark" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-moon"/></svg></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="light" aria-label="Light theme" title="Light" aria-selected="false"><svg class="icon icon--lg themeIcon themeIcon--light" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-sun"/></svg></button>
        </div>
      </div>
      <script>
        (function () {
          try {
            var early = window.__chdashEarlyState || {};
            var mode = early.themeMode || "system";
            if (mode !== "system" && mode !== "dark" && mode !== "light") mode = "system";
            var trigger = document.getElementById("themeSelectButton");
            if (trigger) trigger.setAttribute("aria-label", "Theme: " + mode);
            var menu = document.getElementById("themeSelectMenu");
            if (menu) {
              var opts = menu.querySelectorAll(".themeSelect__option[data-value]");
              for (var i = 0; i < opts.length; i += 1) {

      </script>

  </header>
  <!-- /shell:header -->

  <!-- One h1 per page (an srOnly name, as on the other pages); each view's main opens with its h2. -->
  <h1 class="srOnly">Observability</h1>

  <!-- The view links (an underline row of the nav row, .contentTabs--nav: each view is a page of its own) and,
       on Traces, its Search / Services / Service map tabs on the same row. -->
  <nav id="obsNav" class="obsNav" aria-label="Observability">
    <div id="obsTabs" class="contentTabs contentTabs--nav obsNav__views" role="group" aria-label="Observability views">
      <a class="contentTabs__tab" id="obsTab-traces" data-obs-tab="traces" href="/observability/traces">Traces</a>
      <a class="contentTabs__tab" id="obsTab-logs" data-obs-tab="logs" href="/observability/logs">Logs</a>
      <a class="contentTabs__tab is-active" aria-current="page" id="obsTab-metrics" data-obs-tab="metrics" href="/observability/metrics">Metrics</a>
    </div>
    <script>
      // The head script knows the enabled views: the row shows them from the first paint, its links
      // under the page's base path (a reverse-proxy prefix).
      (function () {
        var enabled = String(document.documentElement.dataset.obsEnabled || "").split(" ");
        document.getElementById("obsTabs").hidden = enabled.length < 2;
        var tabs = document.querySelectorAll("#obsTabs [data-obs-tab]");
        for (var i = 0; i < tabs.length; i++) {
          var name = tabs[i].getAttribute("data-obs-tab");
          tabs[i].hidden = enabled.indexOf(name) < 0;
          if (window.__chdashUrl) tabs[i].setAttribute("href", window.__chdashUrl("observability/" + name));
        }
      })();
    </script>
  </nav>



  <main id="metricsWorkspace" data-obs-panel="metrics" class="obsView metricsWorkspace" role="main">
    <h2 class="srOnly">Metrics</h2>
    <!-- The filter bar: the same .obsFilterBar as on Traces, over the catalog and the panels. -->
    <form id="metricsToolbar" class="obsFilterBar traceSearchBar metricsToolbar" autocomplete="off">
      <div class="obsFilterBar__lead">
        <div class="obsFilterBar__range traceSearchBar__range">
          <div class="themeSelect tracePicker tracePicker--range">
            <select id="metricsRangeUnit" data-field-label="Time range" aria-label="Time range" class="tracePicker__native" tabindex="-1" aria-hidden="true"><option value="range" selected>Last 1 hour</option></select>
            <button class="button themeSelect__button tracePicker__button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-disabled="false">Time range · Last 1 hour</button>
          </div>
        </div>
        <div class="obsFilterBar__field traceSearchField metricsSearchField--service">
          <div class="themeSelect tracePicker is-disabled is-empty">
            <select id="metricsService" data-field-label="Service" data-disable-when-empty="1" aria-label="Service" class="tracePicker__native" tabindex="-1" aria-hidden="true"><option value="" selected>All</option></select>
            <button class="button themeSelect__button tracePicker__button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-disabled="true" disabled>Service · All</button>
            <div class="themeSelect__menu tracePicker__menu" role="listbox" tabindex="-1" hidden></div>
          </div>
        </div>
      </div>
      <div class="obsFilterBar__tail">
        <label class="obsFilterBar__text obsFilterBar__search metricsSearchField">
          <svg class="icon icon--sm obsFilterBar__searchIcon" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-search"/></svg>
          <input id="metricsSearch" class="obsFilterBar__input" type="search" autocomplete="off" spellcheck="false" placeholder="Search metrics or services" aria-label="Search metrics" />
        </label>
        <span id="metricsRangeInfo" class="obsFilterBar__option obsFilterBar__info metricsToolbar__info" aria-live="polite"></span>
        <div class="obsFilterBar__actions">
          <button id="metricsAddPanelButton" class="button obsFilterBar__secondary" type="button" title="Add a chart panel">Add panel</button>
          <button id="metricsSearchButton" class="button button--primary obsFilterBar__submit traceSearchSubmit" type="submit" title="Search: reload the catalog and the charts for the range"><span class="uiSpin" aria-hidden="true"></span><span>Search</span></button>
        </div>
      </div>
    </form>
    <!-- The catalog: an ns.sidePanel shell (app_ui_panel.js): a 32 px rail when folded, a drawer on phones. -->
    <aside id="metricsSidebar" class="uiSide metricsSidebar" aria-label="Metrics catalog">
      <div class="uiSide__head metricsSidebar__head">
        <div class="uiSide__bar">
          <button id="metricsSidebarToggle" class="uiSide__toggle" type="button" aria-expanded="true" aria-controls="metricsSidebar" title="Hide metrics"><svg class="icon icon--sm" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-chart-bar"/></svg><span>Metrics</span></button>
          <span id="metricsCatalogSummary" class="uiSide__meta metricsSidebar__summary" aria-live="polite">Loading metrics…</span>
        </div>
        <div id="metricsCatalogBy" class="segmented segmented--compact metricsCatalogBy" role="group" aria-label="Group the catalog by">
          <button type="button" class="segmented__option" data-catalog-by="metric" aria-pressed="true" title="Each metric once, the services sending it under it">By metric</button>
          <button type="button" class="segmented__option" data-catalog-by="service" aria-pressed="false" title="Each service, its metrics under it">By service</button>
        </div>
      </div>
      <div id="metricsCatalog" class="uiSide__body metricsCatalog" role="tree" aria-label="Services and metrics">
        <div class="uiState uiState--loading uiState--compact" role="status"><span class="uiSpin" aria-hidden="true"></span><p class="uiState__body">Loading the metrics catalog…</p></div>
      </div>
    </aside>

    <section class="metricsMain" aria-label="Metric charts">
      <div id="metricsError" class="uiBanner metricsError" role="alert" hidden></div>
      <div id="metricsPanels" class="metricsPanels">
        <article class="metricsPanel is-active is-empty">
          <div class="metricsPanel__empty"><div class="uiState uiState--empty"><p class="uiState__body">Pick a metric in the catalog to chart it.</p></div></div>
        </article>
      </div>
    </section>
  </main>

      if (!sprite || sprite.indexOf("/static/") === 0) return;
