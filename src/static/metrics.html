<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ClickHouse Dash · Metrics</title>
  <script>
    (function () {
      try {
        var pathname = String(window.location.pathname || "/");
        var marker = pathname.indexOf("/metrics");
        if (marker < 0) marker = pathname.indexOf("/traces");
        if (marker < 0) marker = pathname.indexOf("/explorer");
        if (marker < 0) marker = pathname.indexOf("/query");
        var prefix = marker >= 0 ? pathname.slice(0, marker) : pathname.replace(/\/+$/g, "");
        if (!prefix || prefix === "/") prefix = "";
        var appBase = (prefix ? prefix : "") + "/";
        window.__CHDASH_BASE_PATH__ = appBase;
        window.__chdashUrl = function (path) {
          var raw = String(path || "");
          if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.startsWith("//")) return raw;
          return appBase + raw.replace(/^\/+/, "");
        };
        // Written by the parser, not appended: a script-appended <link> does not
        // block rendering, so the shell would first paint unstyled (native
        // selects, plain buttons) and restyle once style.css lands.
        var cssHref = window.__chdashUrl("static/style.css").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        document.write('<link rel="stylesheet" href="' + cssHref + '">');
        var favicon = document.createElement("link");
        favicon.rel = "icon"; favicon.type = "image/svg+xml";
        favicon.href = window.__chdashUrl("static/images/logo.svg");
        document.head.appendChild(favicon);
        var mode = localStorage.getItem("chdash.theme");
        if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
        if (mode === "dark" || mode === "light") document.documentElement.dataset.theme = mode;
        else delete document.documentElement.dataset.theme;
        document.documentElement.dataset.themeMode = mode;
        // The page switcher is part of the page shell and never waits on
        // /api/version. Only a server that last reported no other page hides it,
        // before the first paint.
        try {
          var pageNav = JSON.parse(localStorage.getItem("chdash.pageNav.v1") || "null");
          if (pageNav && pageNav.explorer === false && pageNav.traces !== true && pageNav.logs !== true && pageNav.metrics !== true) {
            document.documentElement.classList.add("chdash-page-select-hidden");
          }
        } catch (_) {}
        window.__chdashEarlyState = { themeMode: mode };
      } catch (_) {}
    })();
  </script>
</head>
<body data-page="metrics">
  <header class="appHeader" role="banner">
    <div class="appHeader__left">
      <div class="appBrand">
        <span class="appBrand__name">ClickHouse Dash</span>
        <span id="versionBadge" class="versionBadge" title="Backend version">--</span>
      </div>
    </div>
    <div class="appHeader__right">
      <div id="hostPicker" class="picker" aria-label="Target host">
        <button id="hostPickerButton" class="button picker__button" type="button" aria-haspopup="listbox" aria-expanded="false" title="Target host">
          <span id="hostPickerDot" class="hostDot hostDot--bad" aria-hidden="true"></span>
          <span id="hostPickerText" class="picker__text">Host</span>
          <span id="hostPickerVersion" class="hostVersion" aria-label="clickhouse version"></span>
          <span id="hostPickerPing" class="hostPing" aria-label="ping"></span>
        </button>
        <div id="hostPickerMenu" class="picker__menu" role="listbox" tabindex="-1" hidden></div>
      </div>
      <div id="pageSelect" class="themeSelect pageSelect" aria-label="Page">
        <button id="pageSelectButton" class="button themeSelect__button pageSelect__button" type="button" aria-haspopup="listbox" aria-expanded="false">Metrics</button>
        <div id="pageSelectMenu" class="themeSelect__menu pageSelect__menu" role="listbox" tabindex="-1" hidden>
          <button id="navQueryButton" class="themeSelect__option" type="button" role="option" data-value="query" aria-selected="false">Query</button>
          <button id="navExplorerButton" class="themeSelect__option" type="button" role="option" data-value="explorer" aria-selected="false">Explorer</button>
          <button id="navTracesButton" class="themeSelect__option" type="button" role="option" data-value="traces" aria-selected="false">Traces</button>
          <button id="navLogsButton" class="themeSelect__option" type="button" role="option" data-value="logs" aria-selected="false" hidden>Logs</button>
          <button id="navMetricsButton" class="themeSelect__option" type="button" role="option" data-value="metrics" aria-selected="true">Metrics</button>
        </div>
      </div>
      <div id="themeSelect" class="themeSelect themeSelect--icons" aria-label="Theme">
        <button id="themeSelectButton" class="button themeSelect__button themeSelect__button--icon" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Theme" title="Theme"><span id="themeSelectText" class="themeIcon themeIcon--system" aria-hidden="true"></span></button>
        <div id="themeSelectMenu" class="themeSelect__menu themeSelect__menu--icons" role="listbox" tabindex="-1" hidden>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="system" aria-label="System theme" title="System" aria-selected="true"><span class="themeIcon themeIcon--system" aria-hidden="true"></span></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="dark" aria-label="Dark theme" title="Dark" aria-selected="false"><span class="themeIcon themeIcon--dark" aria-hidden="true"></span></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="light" aria-label="Light theme" title="Light" aria-selected="false"><span class="themeIcon themeIcon--light" aria-hidden="true"></span></button>
        </div>
      </div>
    </div>
  </header>

  <main id="metricsWorkspace" class="metricsWorkspace" role="main">
    <aside id="metricsSidebar" class="metricsSidebar" aria-label="Metrics catalog">
      <div class="metricsSidebar__head">
        <input id="metricsSearch" class="metricsSearch" type="search" autocomplete="off" spellcheck="false" placeholder="Search metrics or services" aria-label="Search metrics" />
        <div id="metricsCatalogSummary" class="metricsSidebar__summary" aria-live="polite">Loading metrics…</div>
      </div>
      <div id="metricsCatalog" class="metricsCatalog" role="tree" aria-label="Services and metrics">
        <div class="metricsEmpty metricsEmpty--loading">Loading the metrics catalog…</div>
      </div>
    </aside>

    <section class="metricsMain" aria-label="Metric charts">
      <form id="metricsToolbar" class="traceSearchBar metricsToolbar" autocomplete="off">
        <div class="traceSearchBar__range metricsToolbar__range">
          <div class="traceRangeCompact traceRangeCompact--preset">
            <div class="themeSelect tracePicker tracePicker--range">
              <select id="metricsRangeUnit" data-field-label="Time range" aria-label="Time range" class="tracePicker__native" tabindex="-1" aria-hidden="true"><option value="range" selected>Last 1 hour</option></select>
              <button class="button themeSelect__button tracePicker__button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-disabled="false" aria-controls="metricsTimeRangePanel">Time range · Last 1 hour</button>
              <div id="metricsTimeRangePanel" class="themeSelect__menu tracePicker__menu timeRangePanel" role="dialog" aria-label="Time range" tabindex="-1" hidden>
                <div class="timeRangePanel__body">
                  <section id="metricsCustomRange" class="timeRangePanel__absolute" aria-labelledby="metricsAbsoluteRangeTitle">
                    <h3 id="metricsAbsoluteRangeTitle" class="timeRangePanel__title">Absolute time range</h3>
                    <label class="timeRangeField is-active">
                      <span class="timeRangeField__label">From</span>
                      <input id="metricsRangeStart" class="timeRangeField__input" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="YYYY-MM-DD hh:mm:ss or now-6h" aria-label="Range start" aria-describedby="metricsRangeStartError" />
                      <span id="metricsRangeStartError" class="timeRangeField__error" role="alert" hidden></span>
                    </label>
                    <label class="timeRangeField">
                      <span class="timeRangeField__label">To</span>
                      <input id="metricsRangeEnd" class="timeRangeField__input" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="YYYY-MM-DD hh:mm:ss or now" aria-label="Range end" aria-describedby="metricsRangeEndError" />
                      <span id="metricsRangeEndError" class="timeRangeField__error" role="alert" hidden></span>
                    </label>
                    <div id="metricsTimeCalendarHint" class="timeCalendar__hint" aria-live="polite">Pick the start date</div>
                    <div id="metricsTimeCalendar" class="timeCalendar"></div>
                    <div id="metricsRangeError" class="timeRangePanel__error" role="alert" hidden></div>
                    <button id="metricsCustomRangeApply" class="button button--primary timeRangePanel__apply" type="button">Apply time range</button>
                  </section>
                  <section class="timeRangePanel__quick" aria-label="Quick ranges">
                    <input id="metricsQuickRangeSearch" class="timeRangePanel__search" type="search" autocomplete="off" spellcheck="false" placeholder="Search quick ranges" aria-label="Search quick ranges" />
                    <div id="metricsQuickRanges" class="timeRangeList"></div>
                  </section>
                </div>
                <footer class="timeRangePanel__footer">
                  <span id="metricsTimeZone" class="timeRangePanel__zone">Browser time</span>
                  <div class="timeRangePanel__nav">
                    <button id="metricsRangeShiftBack" class="timeRangeNav" type="button" aria-label="Move time range backwards" title="Move time range backwards"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
                    <button id="metricsRangeZoomOut" class="timeRangeNav" type="button" aria-label="Zoom out time range" title="Zoom out time range"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="M5 7h4M10.2 10.2 13.5 13.5"/></svg></button>
                    <button id="metricsRangeShiftForward" class="timeRangeNav" type="button" aria-label="Move time range forwards" title="Move time range forwards"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
                  </div>
                </footer>
              </div>
            </div>
          </div>
        </div>
        <span id="metricsRangeInfo" class="metricsToolbar__info" aria-live="polite"></span>
        <div class="metricsToolbar__actions">
          <button id="metricsAddPanelButton" class="button metricsToolbar__button" type="button" title="Add a chart panel">Add panel</button>
          <button id="metricsRefreshButton" class="button button--primary metricsToolbar__button" type="submit" title="Reload the catalog and charts">Refresh</button>
        </div>
      </form>
      <div id="metricsError" class="tracesError metricsError" role="alert" hidden></div>
      <div id="metricsPanels" class="metricsPanels">
        <article class="metricsPanel is-active is-empty">
          <div class="metricsEmpty metricsEmpty--panel">Pick a metric in the catalog to chart it.</div>
        </article>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var script = document.createElement("script");
      script.src = (window.__chdashUrl ? window.__chdashUrl("static/app_metrics_bootstrap.js") : "/static/app_metrics_bootstrap.js");
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
