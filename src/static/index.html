<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ClickHouse Dash</title>
  <link rel="stylesheet" href="./static/style.css" />
  <link rel="icon" href="./static/images/logo.svg" type="image/svg+xml">
  <link rel="alternate icon" href="./static/images/favicon.ico" sizes="any">
</head>

<body>
  <header class="appHeader" role="banner">
    <div class="appHeader__left">
      <div class="appBrand">
        <span class="appBrand__name">ClickHouse Dash</span>
        <span id="versionBadge" class="versionBadge" title="Backend version">--</span>
      </div>

      <nav class="appNav" aria-label="Pages">
        <!-- <a class="appNav__item is-active" href="/">Query</a> -->
      </nav>
    </div>

    <div class="appHeader__right">
      <div id="hostPicker" class="picker" aria-label="Target host">
        <button
          id="hostPickerButton"
          class="button picker__button"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          title="Target host">
          <span id="hostPickerDot" class="hostDot hostDot--bad" aria-hidden="true"></span>
          <span id="hostPickerText" class="picker__text">Host</span>
          <span id="hostPickerPing" class="hostPing" aria-label="ping"></span>
        </button>

        <div id="hostPickerMenu" class="picker__menu" role="listbox" tabindex="-1" hidden></div>
      </div>

      <div id="themeSelect" class="themeSelect" aria-label="Theme">
        <button
          id="themeSelectButton"
          class="button themeSelect__button"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false">
          <span id="themeSelectText">System</span>
        </button>

        <div
          id="themeSelectMenu"
          class="themeSelect__menu"
          role="listbox"
          tabindex="-1"
          hidden>
          <button type="button" class="themeSelect__option" role="option" data-value="system" aria-selected="true">System</button>
          <button type="button" class="themeSelect__option" role="option" data-value="dark" aria-selected="false">Dark</button>
          <button type="button" class="themeSelect__option" role="option" data-value="light" aria-selected="false">Light</button>
        </div>
      </div>
    </div>
  </header>

  <main class="layout" role="main">
    <section class="panel panel--query">
      <textarea
        id="queryTextArea"
        spellcheck="false"
        placeholder="Write a ClickHouse query (all statements allowed)"></textarea>

      <div class="panel_bottom">
        <div class="statusBlock">
          <div class="statusPill">
            <span class="statusPill__label">Status</span>
            <span id="queryStatusText" class="statusPill__value">idle</span>
          </div>

          <div class="statusPill">
            <span class="statusPill__label">Query ID</span>
            <span id="queryIdentifierText" class="statusPill__value statusPill__value--mono">-</span>
          </div>
        </div>

        <div class="queryActions">
          <div id="runSplit" class="runSplit">
            <div class="runSplit__buttons">
              <button id="runButton" class="button button--primary runSplit__main" type="button">Run</button>
              <button
                id="runMenuButton"
                class="button button--primary runSplit__toggle"
                type="button"
                aria-haspopup="menu"
                aria-expanded="false"
                title="Run options">
                </button>
            </div>
            <div id="runMenu" class="runMenu" role="menu" tabindex="-1" hidden>
              <button id="runOptAutoFormat" class="runMenu__opt" type="button" role="menuitemcheckbox" aria-checked="false">
                <span class="runMenu__optCheck" aria-hidden="true"></span>
                <span class="runMenu__optText">Auto-format</span>
              </button>
              <button id="runOptMultiQuery" class="runMenu__opt" type="button" role="menuitemcheckbox" aria-checked="false">
                <span class="runMenu__optCheck" aria-hidden="true"></span>
                <span class="runMenu__optText">Allow multiquery</span>
              </button>
            </div>
          </div>
          <button id="formatButton" class="button" type="button">Format</button>
          <button id="cancelButton" class="button" disabled>Clear</button>

          <div class="historyMenu">
            <button id="historyButton" class="button" type="button">History</button>
            <div id="historyPanel" class="historyPanel" hidden></div>
          </div>
        </div>
      </div>
    </section>

    <section class="panel panel--metrics">
      <div class="metricColumn">

        <div class="metricCompact">
          <div class="metricCompact__content">
            <div class="metricCompact__label">Elapsed</div>
            <div class="metricCompact__value" id="elapsedSecondsText">-</div>
          </div>
        </div>

        <div class="metricCompact metricCompact--progress" id="progressCard">
          <div class="metricCompact__content">
            <div class="metricCompact__label">Progress</div>
            <div class="metricCompact__value" id="progressPercentText">-</div>
          </div>
        </div>

        <div class="metricCompact">
          <canvas id="readRowsChart" class="metricCompact__bgChart" aria-label="Read rows per second"></canvas>
          <div class="metricCompact__content">
            <div class="metricCompact__label">Rows</div>
            <div class="metricCompact__value" id="readRowsRateText">-</div>
            <div class="metricCompact__sub" id="readRowsTotalText">-</div>
          </div>
        </div>

        <div class="metricCompact">
          <canvas id="readBytesChart" class="metricCompact__bgChart" aria-label="Read bytes per second"></canvas>
          <div class="metricCompact__content">
            <div class="metricCompact__label">Disk</div>
            <div class="metricCompact__value" id="readBytesRateText">-</div>
            <div class="metricCompact__sub" id="readBytesTotalText">-</div>
          </div>
        </div>

        <div class="metricCompact">
          <canvas id="cpuChart" class="metricCompact__bgChart" aria-label="CPU progression"></canvas>
          <div class="metricCompact__content">
            <div class="metricCompact__label">CPU</div>
            <div class="metricCompact__value" id="cpuText">-</div>
            <div class="metricCompact__sub" id="cpuMaxText">-</div>
          </div>
        </div>

        <div class="metricCompact">
          <canvas id="memoryChart" class="metricCompact__bgChart" aria-label="Memory progression"></canvas>
          <div class="metricCompact__content">
            <div class="metricCompact__label">Memory</div>
            <div class="metricCompact__value" id="memoryText">-</div>
            <div class="metricCompact__sub" id="memoryMaxText">-</div>
          </div>
        </div>

        <div class="metricCompact">
          <canvas id="threadChart" class="metricCompact__bgChart" aria-label="Threads progression"></canvas>
          <div class="metricCompact__content">
            <div class="metricCompact__label">Threads</div>
            <div class="metricCompact__value" id="threadText">-</div>
            <div class="metricCompact__sub" id="threadMaxText">-</div>
          </div>
        </div>

      </div>
    </section>

    <section id="resultsPanel" class="panel panel--results is-hidden">
      <div class="panel__header">
        <div class="panel__title">Results</div>
        <div class="panel__meta">
          <span class="metaItem" id="resultColumnsText">-</span>
          <button id="copyJsonButton" class="button button--small resultsStack__copy" type="button" disabled>
            Copy JSON
          </button>
          <span id="copyJsonToast" class="copyToast" hidden>Copied</span>
        </div>
      </div>

      <div class="errorBanner" id="errorBanner" hidden></div>

      <div class="tableWrap">
        <table class="resultTable">
          <thead id="resultTableHead"></thead>
          <tbody id="resultTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="./static/app.js" defer></script>
</body>
</html>
