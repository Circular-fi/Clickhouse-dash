<!doctype html>

  <title>ClickHouse Dash · System</title>
  <script>
    (function () {
      try {
        var pathname = String(window.location.pathname || "/");
        var marker = pathname.indexOf("/system");
        if (marker < 0) marker = pathname.indexOf("/explorer");
        if (marker < 0) marker = pathname.indexOf("/query");
        if (marker < 0) marker = pathname.indexOf("/observability");
        var prefix = marker >= 0 ? pathname.slice(0, marker) : pathname.replace(/\/+$/g, "");
        if (!prefix || prefix === "/") prefix = "";
        var appBase = (prefix ? prefix : "") + "/";
        window.__CHDASH_BASE_PATH__ = appBase;
        window.__chdashUrl = function (path) {
          var raw = String(path || "");
          if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.startsWith("//")) return raw;
          var rel = raw.replace(/^\/+/, "");
          // A script or stylesheet of this binary has its content hash (the staged shells carry the map,
          // tools/stage_static.py): the address never changes content, so the browser keeps it.
          var hash = window.__chdashAssetVersions && window.__chdashAssetVersions[rel];
          return appBase + rel + (hash ? "?v=" + hash : "");
        };
        // Written by the parser, not appended: a script-appended <link> does not
        // block rendering, so the shell would first paint unstyled and restyle
        // once the stylesheet lands.
        var cssHref = window.__chdashUrl("static/style.queries.css").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        document.write('<link rel="stylesheet" href="' + cssHref + '">');
        var favicon = document.createElement("link");
        favicon.rel = "icon"; favicon.type = "image/svg+xml";
        favicon.href = window.__chdashUrl("static/images/logo.svg");
        document.head.appendChild(favicon);
        var fallbackIcon = document.createElement("link");
        fallbackIcon.rel = "alternate icon"; fallbackIcon.sizes = "any";
        fallbackIcon.href = window.__chdashUrl("static/images/favicon.ico");
        document.head.appendChild(fallbackIcon);

        var root = document.documentElement;
        var mode = localStorage.getItem("chdash.theme");
        if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
        if (mode === "dark" || mode === "light") root.dataset.theme = mode;
        else delete root.dataset.theme;
        root.dataset.themeMode = mode;
        // The page switcher is part of the page shell and never waits on
        // /api/version (this page is one of its entries).
        // This page is one section (Queries): the tabs of the row link to the others.
        root.dataset.systemSection = "queries";
        window.__chdashEarlyState = { themeMode: mode };
      } catch (_) {}
    })();
  </script>
  <!-- shell:fonts -->
  <!-- Generated by tools/build_page_css.py from tools/page_shells.py (FONT_PRELOADS): edit it there, then rerun the script. -->
  <script>
    (function () {
      if (!window.__chdashUrl) return;
      // The icon sprite (tools/icons.py): a new drawing is a new address.
      window.__chdashIconSprite = window.__chdashUrl("static/icons.svg?v=b9b85fc46d");
      // Parsed right after the stylesheet link, so the fonts download with it.
      var fonts = ["IBMPlexSans-Regular-Latin1.woff2", "IBMPlexSans-Medium-Latin1.woff2", "IBMPlexMono-Regular-Latin1.woff2"];
      for (var i = 0; i < fonts.length; i += 1) {
        var href = window.__chdashUrl("static/fonts/" + fonts[i]).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        document.write('<link rel="preload" href="' + href + '" as="font" type="font/woff2" crossorigin>');
      }
    })();
  </script>
  <!-- /shell:fonts -->
</head>

<body data-page="system">
  <!-- shell:header -->

  <header class="appHeader" role="banner">
    <div class="appHeader__left">

        <svg class="appBrand__logo" viewBox="0 0 18 18" aria-hidden="true"><rect x="0.75" y="10.5" width="3" height="6" rx="1"/><rect x="5.25" y="5.5" width="3" height="11" rx="1"/><rect x="9.75" y="8" width="3" height="8.5" rx="1"/><rect x="14.25" y="1.5" width="3" height="15" rx="1"/></svg>
        <span class="appBrand__name">ClickHouse Dash</span>
        <span id="versionBadge" class="versionBadge" title="Backend version">--</span>
      </div>
    </div>
    <div class="appHeader__right">
      <div id="hostPicker" class="picker" aria-label="Target host">
        <button
          id="hostPickerButton"
          class="button picker__button"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          title="Target host">
          <span id="hostPickerDot" class="hostDot hostDot--bad" aria-hidden="true"></span>
          <span id="hostPickerText" class="picker__text">Host</span>
          <span id="hostPickerVersion" class="hostVersion" aria-label="clickhouse version"></span>
          <span id="hostPickerPing" class="hostPing" aria-label="ping"></span>
        </button>
        <div id="hostPickerMenu" class="picker__menu" role="listbox" tabindex="-1" hidden></div>
      </div>
      <div id="pageSelect" class="themeSelect pageSelect" aria-label="Page">
        <button id="pageSelectButton" class="button themeSelect__button pageSelect__button" type="button" aria-haspopup="listbox" aria-expanded="false">System</button>
        <div id="pageSelectMenu" class="themeSelect__menu pageSelect__menu" role="listbox" tabindex="-1" hidden>
          <button id="navQueryButton" class="themeSelect__option" type="button" role="option" data-value="query" aria-selected="false">Query</button>
          <button id="navExplorerButton" class="themeSelect__option" type="button" role="option" data-value="explorer" aria-selected="false">Explorer</button>
          <button id="navObservabilityButton" class="themeSelect__option" type="button" role="option" data-value="observability" aria-selected="false" hidden>Observability</button>
          <button id="navSystemButton" class="themeSelect__option" type="button" role="option" data-value="system" aria-selected="true">System</button>
          <button id="navMcpButton" class="themeSelect__option" type="button" role="option" data-value="mcp" aria-selected="false" hidden>MCP</button>
        </div>
      </div>
      <div id="themeSelect" class="themeSelect themeSelect--icons" aria-label="Theme">
        <button
          id="themeSelectButton"
          class="button themeSelect__button themeSelect__button--icon"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-label="Theme: system"
          title="Theme">
          <span id="themeSelectText" class="themeSelect__current" aria-hidden="true"><svg class="icon icon--lg themeIcon themeIcon--system" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-device-desktop"/></svg><svg class="icon icon--lg themeIcon themeIcon--dark" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-moon"/></svg><svg class="icon icon--lg themeIcon themeIcon--light" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-sun"/></svg></span>
        </button>
        <div id="themeSelectMenu" class="themeSelect__menu themeSelect__menu--icons" role="listbox" tabindex="-1" hidden>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="system" aria-label="System theme" title="System" aria-selected="true"><svg class="icon icon--lg themeIcon themeIcon--system" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-device-desktop"/></svg></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="dark" aria-label="Dark theme" title="Dark" aria-selected="false"><svg class="icon icon--lg themeIcon themeIcon--dark" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-moon"/></svg></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="light" aria-label="Light theme" title="Light" aria-selected="false"><svg class="icon icon--lg themeIcon themeIcon--light" aria-hidden="true"><use href="/static/icons.svg?v=b9b85fc46d#i-sun"/></svg></button>
        </div>
      </div>
      <script>
        (function () {
          try {
            var early = window.__chdashEarlyState || {};
            var mode = early.themeMode || "system";
            if (mode !== "system" && mode !== "dark" && mode !== "light") mode = "system";
            var trigger = document.getElementById("themeSelectButton");
            if (trigger) trigger.setAttribute("aria-label", "Theme: " + mode);
            var menu = document.getElementById("themeSelectMenu");
            if (menu) {
              var opts = menu.querySelectorAll(".themeSelect__option[data-value]");
              for (var i = 0; i < opts.length; i += 1) {
                opts[i].setAttribute("aria-selected", String(opts[i].getAttribute("data-value") === mode));
              }
            }
          } catch (_) {}
        })();
      </script>
    </div>
  </header>
  <!-- /shell:header -->

  <!-- The System page (app_system.js, app_system_view.js): the section tabs,
       the section's filter bar (ns.filterBar, the Observability one: time
       range first, filters, refresh), then the section on screen. -->
  <main id="systemWorkspace" class="systemWorkspace" role="main">
    <h1 class="srOnly">System</h1>
    <section id="systemPage" class="systemPage" aria-label="System">
      <nav class="systemPage__nav" aria-label="System sections">
        <div id="systemTabs" class="contentTabs contentTabs--nav systemPage__tabs" role="group" aria-label="System sections">
          <a class="contentTabs__tab" id="systemTab-overview" data-section="overview" href="/system">Overview</a>
          <a class="contentTabs__tab is-active" aria-current="page" id="systemTab-queries" data-section="queries" href="/system/queries">Queries</a>
          <a class="contentTabs__tab" id="systemTab-disks" data-section="disks" href="/system/disks">Disks</a>
        </div>
      </nav>
      <script>
        (function () {
          try {
            // The row's links under the page's base path (a reverse-proxy prefix).
            var tabs = document.querySelectorAll("#systemTabs [data-section]");
            for (var i = 0; i < tabs.length; i += 1) {
              var name = tabs[i].getAttribute("data-section");
              if (window.__chdashUrl) tabs[i].setAttribute("href", window.__chdashUrl(name === "overview" ? "system" : "system/" + name));
            }
          } catch (_) {}
        })();
      </script>
    </section>
  </main>

      if (!sprite || sprite.indexOf("/static/") === 0) return;
      var uses = document.querySelectorAll('use[href^="/static/icons.svg"]');

  <script>
    (function () {
      // Both download at once and run in this order (async = false).
      function start(src) {
        var script = document.createElement("script");
