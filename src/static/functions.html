  <script>
    (function () {
      try {
        var pathname = String(window.location.pathname || "/");
        var marker = pathname.indexOf("/explorer");
        if (marker < 0) marker = pathname.indexOf("/query");
        if (marker < 0) marker = pathname.indexOf("/observability");
        // Known browser routes delimit the application prefix. When the app is
        // opened at a reverse-proxy root such as /clickhouse/, there is no route
        // marker yet: in that case the current directory itself is the prefix.
        var prefix = marker >= 0 ? pathname.slice(0, marker) : pathname.replace(/\/+$/g, "");
        if (!prefix || prefix === "/") prefix = "";

          // tools/stage_static.py): the address never changes content, so the browser keeps it.

        // Written by the parser, not appended: a script-appended <link> does not
        // block rendering, so the shell would first paint unstyled (native
        // selects, plain buttons) and restyle once style.css lands.
        var cssHref = window.__chdashUrl("static/style.functions.css").replace(/&/g, "&amp;").replace(/"/g, "&quot;");

        var favicon = document.createElement("link");
        favicon.rel = "icon"; favicon.type = "image/svg+xml";

        document.head.appendChild(favicon);
        var fallbackIcon = document.createElement("link");
        fallbackIcon.rel = "alternate icon"; fallbackIcon.sizes = "any";
        fallbackIcon.href = window.__chdashUrl("static/images/favicon.ico");
        document.head.appendChild(fallbackIcon);

        var root = document.documentElement;
        var mode = localStorage.getItem("chdash.theme");
        if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
        if (mode === "dark" || mode === "light") {
          root.dataset.theme = mode;
        } else {
          delete root.dataset.theme;
        }
        root.dataset.themeMode = mode;
        // The Query / Explorer / Observability / System switcher is part of the page shell and
        // never waits on /api/version. Only a server that last reported neither
        // Explorer, System nor an Observability view hides it, before the first paint.
        try {
          var pageNav = JSON.parse(localStorage.getItem("chdash.pageNav.v1") || "null");
          if (pageNav && pageNav.explorer === false && pageNav.system === false && pageNav.traces !== true && pageNav.logs !== true && pageNav.metrics !== true && pageNav.mcp !== true) {
            document.documentElement.classList.add("chdash-page-select-hidden");
          }

        // Apply editor UI preferences before CSS loads to avoid a one-frame flash
        // of disabled controls such as the copy button and line numbers.
        var copyButton = localStorage.getItem("chdash.editor.copy_button.enabled");

        var copyHidden = copyButton === "false" || copyButton === "0";
        var lineHidden = lineNumbers === "false" || lineNumbers === "0";
        root.classList.toggle("chdash-copy-button-hidden", copyHidden);
        root.classList.toggle("chdash-line-numbers-hidden", lineHidden);

        // The editor size is stored in sessionStorage by the resize observer. Apply
        // it as a CSS variable before style.css is parsed so the editor does not
        // jump after app_ui.js starts.
        var editorHeightRaw = sessionStorage.getItem("chdash.editorHeight.v1");
        var editorHeight = editorHeightRaw == null ? NaN : Number(editorHeightRaw);
        if (Number.isFinite(editorHeight) && editorHeight > 0) {
          var roundedEditorHeight = Math.round(editorHeight);
          root.style.setProperty("--initialEditorHeight", roundedEditorHeight + "px");
          root.classList.add("chdash-has-initial-editor-height");
          editorHeight = roundedEditorHeight;
        } else {
          editorHeight = null;
        }

        window.__chdashEarlyState = {
          themeMode: mode,

    })();

          <span id="hostPickerText" class="picker__text">Host</span>

          <span id="hostPickerPing" class="hostPing" aria-label="ping"></span>
        </button>
        <div id="hostPickerMenu" class="picker__menu" role="listbox" tabindex="-1" hidden></div>
      </div>
      <div id="themeSelect" class="themeSelect themeSelect--icons" aria-label="Theme">
        <button
          id="themeSelectButton"
          class="button themeSelect__button themeSelect__button--icon"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-label="Theme: system"
          title="Theme">
          <span id="themeSelectText" class="themeSelect__current" aria-hidden="true"><svg class="icon icon--lg themeIcon themeIcon--system" aria-hidden="true"><use href="/static/icons.svg?v=90fc811faf#i-device-desktop"/></svg><svg class="icon icon--lg themeIcon themeIcon--dark" aria-hidden="true"><use href="/static/icons.svg?v=90fc811faf#i-moon"/></svg><svg class="icon icon--lg themeIcon themeIcon--light" aria-hidden="true"><use href="/static/icons.svg?v=90fc811faf#i-sun"/></svg></span>
        </button>

          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="dark" aria-label="Dark theme" title="Dark" aria-selected="false"><svg class="icon icon--lg themeIcon themeIcon--dark" aria-hidden="true"><use href="/static/icons.svg?v=90fc811faf#i-moon"/></svg></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="light" aria-label="Light theme" title="Light" aria-selected="false"><svg class="icon icon--lg themeIcon themeIcon--light" aria-hidden="true"><use href="/static/icons.svg?v=90fc811faf#i-sun"/></svg></button>

      <script>
        (function () {
          try {
            var early = window.__chdashEarlyState || {};
            var mode = early.themeMode || "system";
            if (mode !== "system" && mode !== "dark" && mode !== "light") mode = "system";
            // The page links: under the page's base path (a reverse-proxy prefix), and the pages the server last
            // reported on or off (the key of storage.savePageNav), so the row does not move when /api/version answers.
            var nav = JSON.parse(localStorage.getItem("chdash.pageNav.v1") || "null");
            var links = document.querySelectorAll("#pageSelectMenu a");
            for (var j = 0; j < links.length; j += 1) {
              if (window.__chdashUrl) links[j].setAttribute("href", window.__chdashUrl(links[j].getAttribute("href")));
              // A page that the access of the human does not allow (data-denied, set by the server) stays hidden.
              if (links[j].hasAttribute("data-denied")) continue;
              var shown = nav ? { navExplorerLink: nav.explorer !== false, navObservabilityLink: nav.traces === true || nav.logs === true || nav.metrics === true, navSystemLink: nav.system !== false, navMcpLink: nav.mcp === true }[links[j].id] : undefined;
              if (shown !== undefined && links[j].getAttribute("aria-current") !== "page") links[j].hidden = !shown;
            }
            // The version and the selected host as the last page showed them, so a reload does not blink "--" and "Host"
            // until /api/version and the hosts stream answer (the key of storage.saveHeader).
            var last = JSON.parse(localStorage.getItem("chdash.header.v1") || "null");
            if (last) {
              var badge = document.getElementById("versionBadge");
              if (badge && last.version) {
                badge.textContent = last.version;
                if (last.title) badge.title = last.title;
              }
              var host = last.host;
              if (host && host.id === localStorage.getItem("chdash.selectedHost")) {
                var hostText = document.getElementById("hostPickerText");
                if (hostText) hostText.textContent = host.label;
                var hostVersion = document.getElementById("hostPickerVersion");
                if (hostVersion) hostVersion.textContent = host.version || "";
                var hostDot = document.getElementById("hostPickerDot");
                if (hostDot && host.good) {
                  hostDot.classList.remove("hostDot--bad");
                  hostDot.classList.add("hostDot--good");
                }
                var hostButton = document.getElementById("hostPickerButton");
                if (hostButton) hostButton.title = host.version ? host.label + "\nClickHouse " + host.version : host.label;
              }
            }
            var trigger = document.getElementById("themeSelectButton");
            if (trigger) trigger.setAttribute("aria-label", "Theme: " + mode);
            var menu = document.getElementById("themeSelectMenu");

                opts[i].setAttribute("aria-selected", String(opts[i].getAttribute("data-value") === mode));
              }
            }
          } catch (_) {}
        })();
      </script>

        <!-- The view tabs and, on the Catalog, its Browse / Graph tabs after a
             divider: one underline row (.contentTabs--nav, app_ui_tabs.js),
             the second-level sections as Observability's Search / Services /
             Service map. On a narrow window the row scrolls sideways (with
             ns.shell.edgeCues). The way up to the parent scope is a tool of
             the graph's own toolbar. -->
        <div id="explorerNavTabs" class="explorerTopBar__tabs">
          <div id="explorerViewTabs" class="contentTabs contentTabs--nav" role="group" aria-label="Explorer views">

          <script>

          </div>
