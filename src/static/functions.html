  <script>
    (function () {
      try {
        var pathname = String(window.location.pathname || "/");
        var marker = pathname.indexOf("/explorer");
        if (marker < 0) marker = pathname.indexOf("/query");
        if (marker < 0) marker = pathname.indexOf("/observability");
        // Known browser routes delimit the application prefix. When the app is
        // opened at a reverse-proxy root such as /clickhouse/, there is no route
        // marker yet: in that case the current directory itself is the prefix.
        var prefix = marker >= 0 ? pathname.slice(0, marker) : pathname.replace(/\/+$/g, "");
        if (!prefix || prefix === "/") prefix = "";
        var appBase = (prefix ? prefix : "") + "/";
        window.__CHDASH_BASE_PATH__ = appBase;
        window.__chdashUrl = function (path) {
          var raw = String(path || "");
          if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.startsWith("//")) return raw;
          var rel = raw.replace(/^\/+/, "");
          // A script or stylesheet of this binary has its content hash (the staged shells carry the map,
          // tools/stage_static.py): the address never changes content, so the browser keeps it.
          var hash = window.__chdashAssetVersions && window.__chdashAssetVersions[rel];
          return appBase + rel + (hash ? "?v=" + hash : "");
        };

        // Written by the parser, not appended: a script-appended <link> does not
        // block rendering, so the shell would first paint unstyled (native
        // selects, plain buttons) and restyle once style.css lands.
        var cssHref = window.__chdashUrl("static/style.functions.css").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        document.write('<link rel="stylesheet" href="' + cssHref + '">');
        var favicon = document.createElement("link");
        favicon.rel = "icon"; favicon.type = "image/svg+xml";
        favicon.href = window.__chdashUrl("static/images/logo.svg");
        document.head.appendChild(favicon);
        var fallbackIcon = document.createElement("link");
        fallbackIcon.rel = "alternate icon"; fallbackIcon.sizes = "any";
        fallbackIcon.href = window.__chdashUrl("static/images/favicon.ico");
        document.head.appendChild(fallbackIcon);

        var root = document.documentElement;
        var mode = localStorage.getItem("chdash.theme");
        if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
        if (mode === "dark" || mode === "light") {
          root.dataset.theme = mode;
        } else {
          delete root.dataset.theme;
        }
        root.dataset.themeMode = mode;
        // The Query / Explorer / Observability / System switcher is part of the page shell and
        // never waits on /api/version. Only a server that last reported neither
        // Explorer, System nor an Observability view hides it, before the first paint.
        try {
          var pageNav = JSON.parse(localStorage.getItem("chdash.pageNav.v1") || "null");
          if (pageNav && pageNav.explorer === false && pageNav.system === false && pageNav.traces !== true && pageNav.logs !== true && pageNav.metrics !== true && pageNav.mcp !== true) {
            document.documentElement.classList.add("chdash-page-select-hidden");
          }
        } catch (_) {}

        // Apply editor UI preferences before CSS loads to avoid a one-frame flash
        // of disabled controls such as the copy button and line numbers.
        var copyButton = localStorage.getItem("chdash.editor.copy_button.enabled");
        var lineNumbers = localStorage.getItem("chdash.editor.line_numbers.enabled");
        var copyHidden = copyButton === "false" || copyButton === "0";
        var lineHidden = lineNumbers === "false" || lineNumbers === "0";
        root.classList.toggle("chdash-copy-button-hidden", copyHidden);
        root.classList.toggle("chdash-line-numbers-hidden", lineHidden);

        // The editor size is stored in sessionStorage by the resize observer. Apply
        // it as a CSS variable before style.css is parsed so the editor does not
        // jump after app_ui.js starts.
        var editorHeightRaw = sessionStorage.getItem("chdash.editorHeight.v1");
        var editorHeight = editorHeightRaw == null ? NaN : Number(editorHeightRaw);
        if (Number.isFinite(editorHeight) && editorHeight > 0) {
          var roundedEditorHeight = Math.round(editorHeight);
          root.style.setProperty("--initialEditorHeight", roundedEditorHeight + "px");
          root.classList.add("chdash-has-initial-editor-height");
          editorHeight = roundedEditorHeight;
        } else {
          editorHeight = null;
        }

        window.__chdashEarlyState = {
          themeMode: mode,
          copyButtonHidden: copyHidden,
          lineNumbersHidden: lineHidden,
          editorHeight: editorHeight
        };
      } catch (_) {}
    })();
  </script>

      window.__chdashIconSprite = window.__chdashUrl("static/icons.svg?v=2972138764");

      var fonts = ["IBMPlexSans-Regular-Latin1.woff2", "IBMPlexSans-Medium-Latin1.woff2", "IBMPlexMono-Regular-Latin1.woff2"];

      <script>
        (function () {
          try {
            var early = window.__chdashEarlyState || {};
            var mode = early.themeMode || "system";
            if (mode !== "system" && mode !== "dark" && mode !== "light") mode = "system";
            var trigger = document.getElementById("themeSelectButton");
            if (trigger) trigger.setAttribute("aria-label", "Theme: " + mode);
            var menu = document.getElementById("themeSelectMenu");
            if (menu) {
              var opts = menu.querySelectorAll(".themeSelect__option[data-value]");
              for (var i = 0; i < opts.length; i += 1) {
                opts[i].setAttribute("aria-selected", String(opts[i].getAttribute("data-value") === mode));

            }
          } catch (_) {}
        })();
      </script>

  <main id="explorerWorkspace" class="explorerWorkspace" role="main">
    <h1 class="srOnly">Functions</h1>
    <section class="explorerShell">
      <header id="explorerTopBar" class="explorerTopBar" aria-label="Explorer navigation">
        <button id="explorerTreeToggle" class="button button--small explorerTreeToggle" type="button" aria-controls="explorerListPane" aria-expanded="false" aria-label="Show objects" title="Objects"><span class="explorerTreeToggle__glyph" aria-hidden="true"></span><span class="explorerTreeToggle__text">Objects</span></button>
        <!-- The view tabs and, on the Catalog, its Browse / Graph tabs after a
             divider: one underline row (.contentTabs--nav, app_ui_tabs.js),
             the second-level sections as Observability's Search / Services /
             Service map. On a narrow window the row scrolls sideways (with
             ns.shell.edgeCues). The way up to the parent scope is a tool of
             the graph's own toolbar. -->
        <div id="explorerNavTabs" class="explorerTopBar__tabs">
          <div id="explorerViewTabs" class="contentTabs contentTabs--nav" role="group" aria-label="Explorer views">
            <a class="contentTabs__tab" id="explorerCatalogTab" data-view="catalog" href="/explorer/catalog">Catalog</a>
            <a class="contentTabs__tab is-active" aria-current="page" id="explorerFunctionsTab" data-view="functions" href="/explorer/functions">Functions</a>
          </div>
          <script>
            (function () {
              // The row's links under the page's base path (a reverse-proxy prefix).
              var views = document.querySelectorAll("#explorerViewTabs [data-view]");
              for (var i = 0; i < views.length; i += 1) {
                var functions = views[i].getAttribute("data-view") === "functions";
                if (window.__chdashUrl) views[i].setAttribute("href", window.__chdashUrl(functions ? "explorer/functions" : "explorer/catalog"));
              }
            })();
          </script>
        </div>
      </header>

      <div id="explorerError" class="uiBanner" role="alert" hidden></div>

      <div id="explorerFunctionsPane" class="explorerGrid">
        <aside id="explorerFunctionListPane" class="uiSide explorerListPane" aria-label="Functions">
          <div id="explorerFunctionToolbar" class="uiSide__head explorerSideHead">
          <div class="uiSide__searchRow">
            <input id="explorerFunctionSearchInput" class="uiSide__search uiSearch" type="search" placeholder="Search functions" aria-label="Search functions" autocomplete="off" />
            <select id="explorerFunctionCategorySelect" class="explorerSelect explorerFunctionFilter explorerFunctionFilter--native" aria-label="Filter function kind" hidden>
              <option value="">All</option>
              <option value="Function">Function</option>
              <option value="Aggregate Function">Aggregate</option>
              <option value="Table Function">Table</option>
              <option value="user-defined">User-defined</option>
            </select>
            <button id="explorerFunctionRefreshButton" class="refreshButton" type="button" aria-label="Refresh functions" title="Refresh functions"><svg class="icon icon--sm refreshGlyph" aria-hidden="true"><use href="/static/icons.svg?v=2972138764#i-refresh"/></svg></button>
          </div>
          <div id="explorerFunctionFilters" class="uiSide__chips explorerTreeFilters" role="group" aria-label="Function kinds">
            <button class="explorerFilterChip badge badge--md badge--pill badge--accent" type="button" data-function-kind="Function" aria-pressed="true" title="Regular functions only">Functions</button>
            <button class="explorerFilterChip badge badge--md badge--pill badge--accent" type="button" data-function-kind="Aggregate Function" aria-pressed="true" title="Aggregate functions only">Aggregate</button>
            <button class="explorerFilterChip badge badge--md badge--pill badge--accent" type="button" data-function-kind="Table Function" aria-pressed="true" title="Table functions only">Table</button>
            <button class="explorerFilterChip badge badge--md badge--pill badge--accent" type="button" data-function-kind="user-defined" aria-pressed="true" title="User-defined functions only">UDF</button>

          </div>
          <div id="explorerFunctionList" class="uiSide__body explorerTableList"></div>
        </aside>
        <div class="uiSide__backdrop explorerTreeBackdrop" hidden></div>
        <section class="explorerDetailPane">

            <div class="uiState uiState--empty"><strong class="uiState__title">Select a function</strong><p class="uiState__body">Its documentation comes from the selected ClickHouse server, when it has some.</p></div>

              </div>
            </div>
            <div id="explorerFunctionDescription" class="explorerFunctionDescription functionDoc"></div>
          </div>
        </section>
      </div>
    </section>
