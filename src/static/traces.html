<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ClickHouse Dash · Traces</title>
  <script>
    (function () {
      try {
        var pathname = String(window.location.pathname || "/");
        var marker = pathname.indexOf("/traces");
        if (marker < 0) marker = pathname.indexOf("/explorer");
        if (marker < 0) marker = pathname.indexOf("/query");
        var prefix = marker >= 0 ? pathname.slice(0, marker) : pathname.replace(/\/+$/g, "");
        if (!prefix || prefix === "/") prefix = "";
        var appBase = (prefix ? prefix : "") + "/";
        window.__CHDASH_BASE_PATH__ = appBase;
        window.__chdashUrl = function (path) {
          var raw = String(path || "");
          if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.startsWith("//")) return raw;
          return appBase + raw.replace(/^\/+/, "");
        };
        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = window.__chdashUrl("static/style.css");
        document.head.appendChild(css);
        var favicon = document.createElement("link");
        favicon.rel = "icon"; favicon.type = "image/svg+xml";
        favicon.href = window.__chdashUrl("static/images/logo.svg");
        document.head.appendChild(favicon);
        var mode = localStorage.getItem("chdash.theme");
        if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
        if (mode === "dark" || mode === "light") document.documentElement.dataset.theme = mode;
        else delete document.documentElement.dataset.theme;
        document.documentElement.dataset.themeMode = mode;
        window.__chdashEarlyState = { themeMode: mode };
      } catch (_) {}
    })();
  </script>
</head>
<body data-page="traces">
  <header class="appHeader" role="banner">
    <div class="appHeader__left">
      <div class="appBrand">
        <span class="appBrand__name">ClickHouse Dash</span>
        <span id="versionBadge" class="versionBadge" title="Backend version">--</span>
      </div>
    </div>
    <div class="appHeader__right">
      <div id="hostPicker" class="picker" aria-label="Target host">
        <button id="hostPickerButton" class="button picker__button" type="button" aria-haspopup="listbox" aria-expanded="false" title="Target host">
          <span id="hostPickerDot" class="hostDot hostDot--bad" aria-hidden="true"></span>
          <span id="hostPickerText" class="picker__text">Host</span>
          <span id="hostPickerVersion" class="hostVersion" aria-label="clickhouse version"></span>
          <span id="hostPickerPing" class="hostPing" aria-label="ping"></span>
        </button>
        <div id="hostPickerMenu" class="picker__menu" role="listbox" tabindex="-1" hidden></div>
      </div>
      <div id="pageSelect" class="themeSelect pageSelect" aria-label="Page" hidden>
        <button id="pageSelectButton" class="button themeSelect__button pageSelect__button" type="button" aria-haspopup="listbox" aria-expanded="false">Traces</button>
        <div id="pageSelectMenu" class="themeSelect__menu pageSelect__menu" role="listbox" tabindex="-1" hidden>
          <button id="navQueryButton" class="themeSelect__option" type="button" role="option" data-value="query" aria-selected="false">Query</button>
          <button id="navExplorerButton" class="themeSelect__option" type="button" role="option" data-value="explorer" aria-selected="false">Explorer</button>
          <button id="navTracesButton" class="themeSelect__option" type="button" role="option" data-value="traces" aria-selected="true">Traces</button>
        </div>
      </div>
      <div id="themeSelect" class="themeSelect themeSelect--icons" aria-label="Theme">
        <button id="themeSelectButton" class="button themeSelect__button themeSelect__button--icon" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Theme" title="Theme"><span id="themeSelectText" class="themeIcon themeIcon--system" aria-hidden="true"></span></button>
        <div id="themeSelectMenu" class="themeSelect__menu themeSelect__menu--icons" role="listbox" tabindex="-1" hidden>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="system" aria-label="System theme" title="System" aria-selected="true"><span class="themeIcon themeIcon--system" aria-hidden="true"></span></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="dark" aria-label="Dark theme" title="Dark" aria-selected="false"><span class="themeIcon themeIcon--dark" aria-hidden="true"></span></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="light" aria-label="Light theme" title="Light" aria-selected="false"><span class="themeIcon themeIcon--light" aria-hidden="true"></span></button>
        </div>
      </div>
    </div>
  </header>

  <main id="tracesWorkspace" class="tracesWorkspace tracesWorkspace--jaeger" role="main">
    <section class="tracesShell tracesShell--jaeger">
      <div id="tracesError" class="tracesError" hidden></div>

      <section id="tracesSearchView" class="traceSearchView">
        <form id="tracesForm" class="traceSearchBar" autocomplete="off">
          <div class="traceSearchBar__range">
            <div class="traceRangeCompact traceRangeCompact--preset">
              <select id="tracesRangeUnit" data-field-label="Time range" aria-label="Time range">
                <option value="5" data-minutes="5">Last 5 minutes</option>
                <option value="15" data-minutes="15">Last 15 minutes</option>
                <option value="30" data-minutes="30">Last 30 minutes</option>
                <option value="60" data-minutes="60" selected>Last 1 hour</option>
                <option value="180" data-minutes="180">Last 3 hours</option>
                <option value="720" data-minutes="720">Last 12 hours</option>
                <option value="1440" data-minutes="1440">Last 24 hours</option>
                <option value="2880" data-minutes="2880">Last 48 hours</option>
                <option value="10080" data-minutes="10080">Last 7 days</option>
                <option value="43200" data-minutes="43200">Last 30 days</option>
                <option value="129600" data-minutes="129600">Last 3 months</option>
                <option value="259200" data-minutes="259200">Last 6 months</option>
                <option value="525600" data-minutes="525600">Last 12 months</option>
                <option value="custom">Custom range…</option>
              </select>
            </div>
            <div id="tracesCustomRange" class="traceCustomRange" hidden>
              <input id="tracesRangeStart" type="datetime-local" step="1" aria-label="Range start" />
              <span>→</span>
              <input id="tracesRangeEnd" type="datetime-local" step="1" aria-label="Range end" />
            </div>
          </div>

          <button id="tracesPrefillButton" class="button traceActionButton" type="button" title="Load exact service / operation combinations for this time range">
            <span class="traceButtonSpinner" aria-hidden="true"></span><span>Prefill</span>
          </button>

          <label class="traceSearchField traceSearchField--service">
            <input id="tracesService" list="tracesServiceOptions" type="text" placeholder="Service" aria-label="Service" autocomplete="off" />
            <datalist id="tracesServiceOptions"></datalist>
          </label>

          <label class="traceSearchField traceSearchField--operation">
            <input id="tracesOperation" list="tracesOperationOptions" type="text" placeholder="Operation" aria-label="Operation" autocomplete="off" />
            <datalist id="tracesOperationOptions"></datalist>
          </label>

          <div class="traceTagSearch">
            <div class="traceTagSearch__inputs">
              <input id="tracesTagKey" list="tracesTagKeyOptions" type="text" placeholder="Tag" aria-label="Tag key" autocomplete="off" />
              <datalist id="tracesTagKeyOptions"></datalist>
              <input id="tracesTagValue" list="tracesTagValueOptions" type="text" placeholder="Value" aria-label="Tag value" autocomplete="off" />
              <datalist id="tracesTagValueOptions"></datalist>
              <button id="tracesTagsButton" class="traceMiniButton" type="button" disabled title="Load tags after selecting service and operation"><span class="traceButtonSpinner" aria-hidden="true"></span><span>Load tags</span></button>
            </div>
          </div>

          <div class="traceSearchField traceSearchField--status">
            <select id="tracesStatus" data-field-label="Status" aria-label="Status"><option value="">ALL</option><option value="Ok">OK</option><option value="Error">ERROR</option><option value="Unset">UNSET</option></select>
            <button class="traceInfoButton traceInfoButton--inline" type="button" aria-label="OpenTelemetry status information" title="OpenTelemetry span status values are UNSET, OK, and ERROR. UNSET is the default; OK means explicitly successful.">i</button>
          </div>

          <label class="traceSearchField traceSearchField--limit">
            <select id="tracesLimit" data-field-label="Results" aria-label="Results"><option value="20">20</option><option value="50" selected>50</option><option value="100">100</option><option value="250">250</option><option value="500">500</option></select>
          </label>

          <button id="tracesSearchButton" class="button button--primary traceSearchSubmit" type="submit"><span class="traceButtonSpinner" aria-hidden="true"></span><span>Search</span></button>
          <span id="tracesSourceMeta" class="tracesSourceMeta traceSearchBar__source">Loading source…</span>
        </form>

        <section class="traceAnalyticsGrid" aria-label="Trace analytics">
          <article class="traceAnalyticsCard">
            <header><strong>Matching traces</strong><span id="traceServiceChartMeta">traces over time</span></header>
            <div id="traceServiceChart" class="traceChart"><div class="tracesEmpty">Search to load matching trace activity.</div></div>
          </article>
          <article class="traceAnalyticsCard">
            <header><strong>Trace duration</strong><span id="traceDurationChartMeta">points + P50 / P90 / P95 / P99</span></header>
            <div id="traceDurationChart" class="traceChart"><div class="tracesEmpty">Search to load duration distribution.</div></div>
          </article>
        </section>

        <section class="traceResultsSection" aria-label="Trace search results">
          <div class="traceSearchResults__toolbar">
            <h2 id="tracesResultCount">0 Traces</h2>
            <label class="traceResultsSort"><span>Sort:</span><select id="tracesSort"><option value="recent">Most Recent</option><option value="longest">Longest First</option><option value="shortest">Shortest First</option><option value="spans">Most Spans</option></select></label>
          </div>
          <div id="tracesResults" class="tracesResults tracesResults--wide"><div class="tracesEmpty">Search to load traces.</div></div>
        </section>
      </section>

      <section id="traceDetail" class="traceDetailPane traceDetailPane--jaeger" aria-live="polite" hidden>
        <header id="traceDetailHeader" class="tracePageHeader">
          <div class="tracePageHeader__titleRow">
            <button id="traceBackButton" type="button" class="tracePageBack" aria-label="Back to trace search" title="Back to search"><svg stroke="currentColor" fill="currentColor" stroke-width="0" viewBox="0 0 512 512" aria-hidden="true"><path fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="48" d="M244 400 100 256l144-144M120 256h292"></path></svg></button>
            <div id="traceDetailTitle" class="tracePageHeader__title"><strong>Trace</strong><span>Select a trace to inspect its spans.</span></div>
            <div id="traceDetailStats" class="tracePageHeader__overview"></div>
          </div>
          <div id="traceServiceFilters" class="traceServiceFilters" aria-label="Filter trace services"></div>
          <div id="traceOverview" class="traceOverview" aria-label="Trace overview"></div>
        </header>
        <div class="traceTimelineFrame">
          <div id="traceWaterfall" class="traceWaterfall traceWaterfall--jaeger"><div class="tracesEmpty">No trace selected.</div></div>
          <section id="traceInspector" class="traceInspector traceInspector--jaeger" hidden></section>
        </div>
      </section>
    </section>
  </main>

  <script>
    (function () {
      var script = document.createElement("script");
      script.src = (window.__chdashUrl ? window.__chdashUrl("static/app_traces_bootstrap.js") : "/static/app_traces_bootstrap.js");
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
