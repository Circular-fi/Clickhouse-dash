  <script>
    (function () {
      try {
        var pathname = String(window.location.pathname || "/");
        var marker = pathname.indexOf("/observability");
        if (marker < 0) marker = pathname.indexOf("/explorer");
        if (marker < 0) marker = pathname.indexOf("/query");
        var prefix = marker >= 0 ? pathname.slice(0, marker) : pathname.replace(/\/+$/g, "");
        if (!prefix || prefix === "/") prefix = "";
        var appBase = (prefix ? prefix : "") + "/";
        window.__CHDASH_BASE_PATH__ = appBase;
        window.__chdashUrl = function (path) {
          var raw = String(path || "");
          if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.startsWith("//")) return raw;
          var rel = raw.replace(/^\/+/, "");
          // A script or stylesheet of this binary has its content hash (the staged shells carry the map,
          // tools/stage_static.py): the address never changes content, so the browser keeps it.
          var hash = window.__chdashAssetVersions && window.__chdashAssetVersions[rel];
          return appBase + rel + (hash ? "?v=" + hash : "");
        };
        // The page switcher is part of the page shell and never waits on
        // /api/version. Only a server that last reported no other page hides it,
        // before the first paint. The same last answer says which views
        // (Traces, Logs, Metrics) have a tab.
        var pageNav = null;
        try {
          pageNav = JSON.parse(localStorage.getItem("chdash.pageNav.v1") || "null");
          if (pageNav && pageNav.explorer === false && pageNav.system === false && pageNav.traces !== true && pageNav.logs !== true && pageNav.metrics !== true) {
            document.documentElement.classList.add("chdash-page-select-hidden");
          }
        } catch (_) {}
        // This page is one view: the tabs of the row link to the others, and the ones the server
        // last reported turned off are hidden before the first paint.
        var views = ["traces", "logs", "metrics"];
        var enabled = views.filter(function (name) { return !pageNav || pageNav[name] === true; });
        if (!enabled.length) enabled = views;
        var view = "logs";
        document.documentElement.dataset.obsView = view;
        document.documentElement.dataset.obsEnabled = enabled.join(" ");
        document.title = "ClickHouse Dash · Logs";
        // Written by the parser, not appended: a script-appended <link> does not
        // block rendering, so the shell would first paint unstyled (native
        // selects, plain buttons) and restyle once the stylesheet lands.
        var cssHref = window.__chdashUrl("static/style.logs.css").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        document.write('<link rel="stylesheet" href="' + cssHref + '">');
        var favicon = document.createElement("link");
        favicon.rel = "icon"; favicon.type = "image/svg+xml";
        favicon.href = window.__chdashUrl("static/images/logo.svg");
        document.head.appendChild(favicon);

        var mode = localStorage.getItem("chdash.theme");
        if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
        if (mode === "dark" || mode === "light") document.documentElement.dataset.theme = mode;
        else delete document.documentElement.dataset.theme;
        document.documentElement.dataset.themeMode = mode;
        // The side panels (Traces Attributes, Logs Fields, the Metrics
        // catalog) keep their open / folded state from the first paint, each
        // its own (the facets fold by default on narrow windows).
        try {
          // [store key, <html> class, folded by default below 1100 px]
          var facetRails = [["chdash.traceFacetsCollapsed.v1", "chdash-trace-facets-collapsed", true], ["chdash.logsFacetsCollapsed.v1", "chdash-logs-facets-collapsed", true], ["chdash.metricsCatalogCollapsed.v1", "chdash-metrics-catalog-collapsed", false]];
          for (var f = 0; f < facetRails.length; f += 1) {
            var facets = localStorage.getItem(facetRails[f][0]);
            if (facets === "1" || (facetRails[f][2] && facets !== "0" && window.innerWidth < 1100)) {
              document.documentElement.classList.add(facetRails[f][1]);
            }

        } catch (_) {}

      } catch (_) {}
