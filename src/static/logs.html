<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ClickHouse Dash · Logs</title>
  <script>
    (function () {
      try {
        var pathname = String(window.location.pathname || "/");
        var marker = pathname.indexOf("/logs");
        if (marker < 0) marker = pathname.indexOf("/traces");
        if (marker < 0) marker = pathname.indexOf("/explorer");
        if (marker < 0) marker = pathname.indexOf("/query");
        var prefix = marker >= 0 ? pathname.slice(0, marker) : pathname.replace(/\/+$/g, "");
        if (!prefix || prefix === "/") prefix = "";
        var appBase = (prefix ? prefix : "") + "/";
        window.__CHDASH_BASE_PATH__ = appBase;
        window.__chdashUrl = function (path) {
          var raw = String(path || "");
          if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.startsWith("//")) return raw;
          return appBase + raw.replace(/^\/+/, "");
        };
        // Written by the parser, not appended: a script-appended <link> does not
        // block rendering, so the shell would first paint unstyled (native
        // selects, plain buttons) and restyle once style.css lands.
        var cssHref = window.__chdashUrl("static/style.css").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        document.write('<link rel="stylesheet" href="' + cssHref + '">');
        var favicon = document.createElement("link");
        favicon.rel = "icon"; favicon.type = "image/svg+xml";
        favicon.href = window.__chdashUrl("static/images/logo.svg");
        document.head.appendChild(favicon);
        var mode = localStorage.getItem("chdash.theme");
        if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
        if (mode === "dark" || mode === "light") document.documentElement.dataset.theme = mode;
        else delete document.documentElement.dataset.theme;
        document.documentElement.dataset.themeMode = mode;
        // The Query / Explorer / Traces / Logs switcher is part of the page shell and
        // never waits on /api/version. Only a server that last reported neither
        // Explorer, Traces nor Logs hides it, before the first paint.
        try {
          var pageNav = JSON.parse(localStorage.getItem("chdash.pageNav.v1") || "null");
          if (pageNav && pageNav.explorer === false && pageNav.traces !== true && pageNav.logs !== true) {
            document.documentElement.classList.add("chdash-page-select-hidden");
          }
        } catch (_) {}
        window.__chdashEarlyState = { themeMode: mode };
      } catch (_) {}
    })();
  </script>
</head>
<body data-page="logs">
  <header class="appHeader" role="banner">
    <div class="appHeader__left">
      <div class="appBrand">
        <span class="appBrand__name">ClickHouse Dash</span>
        <span id="versionBadge" class="versionBadge" title="Backend version">--</span>
      </div>
    </div>
    <div class="appHeader__right">
      <div id="hostPicker" class="picker" aria-label="Target host">
        <button id="hostPickerButton" class="button picker__button" type="button" aria-haspopup="listbox" aria-expanded="false" title="Target host">
          <span id="hostPickerDot" class="hostDot hostDot--bad" aria-hidden="true"></span>
          <span id="hostPickerText" class="picker__text">Host</span>
          <span id="hostPickerVersion" class="hostVersion" aria-label="clickhouse version"></span>
          <span id="hostPickerPing" class="hostPing" aria-label="ping"></span>
        </button>
        <div id="hostPickerMenu" class="picker__menu" role="listbox" tabindex="-1" hidden></div>
      </div>
      <div id="pageSelect" class="themeSelect pageSelect" aria-label="Page">
        <button id="pageSelectButton" class="button themeSelect__button pageSelect__button" type="button" aria-haspopup="listbox" aria-expanded="false">Logs</button>
        <div id="pageSelectMenu" class="themeSelect__menu pageSelect__menu" role="listbox" tabindex="-1" hidden>
          <button id="navQueryButton" class="themeSelect__option" type="button" role="option" data-value="query" aria-selected="false">Query</button>
          <button id="navExplorerButton" class="themeSelect__option" type="button" role="option" data-value="explorer" aria-selected="false">Explorer</button>
          <button id="navTracesButton" class="themeSelect__option" type="button" role="option" data-value="traces" aria-selected="false" hidden>Traces</button>
          <button id="navLogsButton" class="themeSelect__option" type="button" role="option" data-value="logs" aria-selected="true">Logs</button>
        </div>
      </div>
      <div id="themeSelect" class="themeSelect themeSelect--icons" aria-label="Theme">
        <button id="themeSelectButton" class="button themeSelect__button themeSelect__button--icon" type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Theme" title="Theme"><span id="themeSelectText" class="themeIcon themeIcon--system" aria-hidden="true"></span></button>
        <div id="themeSelectMenu" class="themeSelect__menu themeSelect__menu--icons" role="listbox" tabindex="-1" hidden>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="system" aria-label="System theme" title="System" aria-selected="true"><span class="themeIcon themeIcon--system" aria-hidden="true"></span></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="dark" aria-label="Dark theme" title="Dark" aria-selected="false"><span class="themeIcon themeIcon--dark" aria-hidden="true"></span></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="light" aria-label="Light theme" title="Light" aria-selected="false"><span class="themeIcon themeIcon--light" aria-hidden="true"></span></button>
        </div>
      </div>
    </div>
  </header>

  <main id="logsWorkspace" class="tracesWorkspace tracesWorkspace--jaeger logsWorkspace" role="main">
    <section class="tracesShell tracesShell--jaeger logsShell">
      <form id="logsForm" class="traceSearchBar logsSearchBar" autocomplete="off">
        <div class="traceSearchBar__range logsSearchBar__range">
          <div class="traceRangeCompact traceRangeCompact--preset">
            <div class="themeSelect tracePicker tracePicker--range">
              <select id="logsRangeUnit" data-field-label="Time range" aria-label="Time range" class="tracePicker__native" tabindex="-1" aria-hidden="true"><option value="range" selected>Last 15 minutes</option></select>
              <button class="button themeSelect__button tracePicker__button" type="button" aria-haspopup="dialog" aria-expanded="false" aria-disabled="false" aria-controls="logsTimeRangePanel">Time range · Last 15 minutes</button>
              <div id="logsTimeRangePanel" class="themeSelect__menu tracePicker__menu timeRangePanel" role="dialog" aria-label="Time range" tabindex="-1" hidden>
                <div class="timeRangePanel__body">
                  <section id="logsCustomRange" class="timeRangePanel__absolute" aria-labelledby="logsAbsoluteRangeTitle">
                    <h3 id="logsAbsoluteRangeTitle" class="timeRangePanel__title">Absolute time range</h3>
                    <label class="timeRangeField is-active">
                      <span class="timeRangeField__label">From</span>
                      <input id="logsRangeStart" class="timeRangeField__input" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="YYYY-MM-DD hh:mm:ss or now-6h" aria-label="Range start" aria-describedby="logsRangeStartError" />
                      <span id="logsRangeStartError" class="timeRangeField__error" role="alert" hidden></span>
                    </label>
                    <label class="timeRangeField">
                      <span class="timeRangeField__label">To</span>
                      <input id="logsRangeEnd" class="timeRangeField__input" type="text" inputmode="text" autocomplete="off" spellcheck="false" placeholder="YYYY-MM-DD hh:mm:ss or now" aria-label="Range end" aria-describedby="logsRangeEndError" />
                      <span id="logsRangeEndError" class="timeRangeField__error" role="alert" hidden></span>
                    </label>
                    <div id="logsTimeCalendarHint" class="timeCalendar__hint" aria-live="polite">Pick the start date</div>
                    <div id="logsTimeCalendar" class="timeCalendar"></div>
                    <div id="logsRangeError" class="timeRangePanel__error" role="alert" hidden></div>
                    <button id="logsCustomRangeApply" class="button button--primary timeRangePanel__apply" type="button">Apply time range</button>
                  </section>
                  <section class="timeRangePanel__quick" aria-label="Quick ranges">
                    <input id="logsQuickRangeSearch" class="timeRangePanel__search" type="search" autocomplete="off" spellcheck="false" placeholder="Search quick ranges" aria-label="Search quick ranges" />
                    <div id="logsQuickRanges" class="timeRangeList"></div>
                  </section>
                </div>
                <footer class="timeRangePanel__footer">
                  <span id="logsTimeZone" class="timeRangePanel__zone">Browser time</span>
                  <div class="timeRangePanel__nav">
                    <button id="logsRangeShiftBack" class="timeRangeNav" type="button" aria-label="Move time range backwards" title="Move time range backwards"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg></button>
                    <button id="logsRangeZoomOut" class="timeRangeNav" type="button" aria-label="Zoom out time range" title="Zoom out time range"><svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="M5 7h4M10.2 10.2 13.5 13.5"/></svg></button>
                    <button id="logsRangeShiftForward" class="timeRangeNav" type="button" aria-label="Move time range forwards" title="Move time range forwards"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg></button>
                  </div>
                </footer>
              </div>
            </div>
          </div>
        </div>

        <div class="traceSearchField logsSearchField--service">
          <div id="logsServicePicker" class="themeSelect tracePicker logsMultiPicker">
            <button id="logsServiceButton" class="button themeSelect__button tracePicker__button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-disabled="false">Service · ALL</button>
            <div id="logsServiceMenu" class="themeSelect__menu tracePicker__menu logsMultiPicker__menu" role="listbox" aria-multiselectable="true" tabindex="-1" hidden></div>
          </div>
        </div>

        <div class="traceSearchField logsSearchField--level">
          <div class="themeSelect tracePicker">
            <select id="logsLevel" data-field-label="Level" aria-label="Minimum severity" class="tracePicker__native"><option value="" selected>ALL</option><option value="5">≥ DEBUG</option><option value="9">≥ INFO</option><option value="13">≥ WARN</option><option value="17">≥ ERROR</option><option value="21">≥ FATAL</option></select>
            <button class="button themeSelect__button tracePicker__button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-disabled="false">Level · ALL</button>
            <div class="themeSelect__menu tracePicker__menu" role="listbox" tabindex="-1" hidden></div>
          </div>
        </div>

        <label class="logsQueryField">
          <svg class="logsQueryField__icon" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"/><path d="M10.4 10.4 14 14"/></svg>
          <input id="logsQuery" type="search" placeholder="Search Body: words, &quot;exact phrase&quot;, -exclude" aria-label="Search log bodies" autocomplete="off" spellcheck="false" />
        </label>

        <label class="logsFilterField">
          <input id="logsFilterInput" type="text" placeholder="Filter key=value, key!=value, TraceId=…" aria-label="Add a filter" autocomplete="off" spellcheck="false" />
        </label>

        <button id="logsSearchButton" class="button button--primary traceSearchSubmit logsSearchSubmit" type="submit"><span class="traceButtonSpinner" aria-hidden="true"></span><span>Search</span></button>
      </form>

      <div id="logsChips" class="logsChips" aria-label="Active filters" hidden></div>
      <div id="logsError" class="tracesError logsError" role="alert" hidden></div>

      <section id="logsHistogramCard" class="logsHistogram" aria-label="Log volume">
        <header class="logsHistogram__header">
          <strong id="logsTotal" class="logsHistogram__total">–</strong>
          <span id="logsHistogramMeta" class="logsHistogram__meta">logs over time</span>
          <div id="logsLegend" class="logsLegend" role="group" aria-label="Severity classes">
            <button type="button" class="logsLegend__item" data-sev="error" aria-pressed="false"><i class="logsSevSwatch logsSev--error"></i><span>Error</span><b data-sev-count="error"></b></button>
            <button type="button" class="logsLegend__item" data-sev="warn" aria-pressed="false"><i class="logsSevSwatch logsSev--warn"></i><span>Warn</span><b data-sev-count="warn"></b></button>
            <button type="button" class="logsLegend__item" data-sev="info" aria-pressed="false"><i class="logsSevSwatch logsSev--info"></i><span>Info</span><b data-sev-count="info"></b></button>
            <button type="button" class="logsLegend__item" data-sev="debug" aria-pressed="false"><i class="logsSevSwatch logsSev--debug"></i><span>Debug</span><b data-sev-count="debug"></b></button>
          </div>
        </header>
        <div id="logsHistogram" class="logsHistogram__chart"><div class="tracesEmpty">Search to load the log volume.</div></div>
      </section>

      <div class="logsToolbar" role="toolbar" aria-label="Results">
        <div class="logsTabs" role="tablist" aria-label="Logs view">
          <button id="logsTabResults" class="logsTabs__tab is-active" type="button" role="tab" aria-selected="true" aria-controls="logsResultsPane" data-tab="results">Results</button>
          <button id="logsTabPatterns" class="logsTabs__tab" type="button" role="tab" aria-selected="false" aria-controls="logsPatternsPane" data-tab="patterns">Patterns</button>
        </div>
        <span id="logsStatus" class="logsStatus" aria-live="polite"></span>
        <div class="logsToolbar__actions">
          <label id="logsDenoiseToggle" class="logsSwitch" hidden><input id="logsDenoise" type="checkbox" /><span>Denoise</span></label>
          <div id="logsColumnsPicker" class="themeSelect tracePicker logsColumnsPicker">
            <button id="logsColumnsButton" class="button themeSelect__button tracePicker__button" type="button" aria-haspopup="listbox" aria-expanded="false">Columns</button>
            <div id="logsColumnsMenu" class="themeSelect__menu tracePicker__menu logsMultiPicker__menu" role="listbox" aria-multiselectable="true" tabindex="-1" hidden></div>
          </div>
          <button id="logsLiveButton" class="button logsLiveButton" type="button" aria-pressed="false" title="Live tail: poll for new logs"><span class="logsLiveDot" aria-hidden="true"></span><span>Live</span></button>
        </div>
      </div>

      <div class="logsBody">
        <section id="logsResultsPane" class="logsPane" role="tabpanel" aria-labelledby="logsTabResults">
          <div id="logsTable" class="logsTable" tabindex="0" aria-label="Log records">
            <div id="logsTableHead" class="logsTable__head" role="row"></div>
            <div id="logsTableViewport" class="logsTable__viewport">
              <div id="logsTableSpacer" class="logsTable__spacer"></div>
              <div id="logsTableRows" class="logsTable__rows" role="rowgroup"></div>
            </div>
            <div id="logsTableMessage" class="logsTable__message"><div class="tracesEmpty">Search to load logs.</div></div>
          </div>
        </section>
        <section id="logsPatternsPane" class="logsPane logsPatterns" role="tabpanel" aria-labelledby="logsTabPatterns" hidden>
          <div id="logsPatterns" class="logsPatterns__body"><div class="tracesEmpty">Open this tab to mine the patterns of the current search.</div></div>
        </section>
        <aside id="logsSidePanel" class="logsSidePanel" aria-label="Log record" hidden>
          <header class="logsSidePanel__header">
            <div id="logsSideTitle" class="logsSidePanel__title"></div>
            <div class="logsSidePanel__headerActions">
              <a id="logsOpenTrace" class="button button--small logsOpenTrace" href="#" hidden>Open trace</a>
              <button id="logsCopyJson" class="button button--small" type="button">Copy JSON</button>
              <button id="logsSideClose" class="logsSidePanel__close" type="button" aria-label="Close" title="Close (Esc)"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
            </div>
          </header>
          <div class="logsSideTabs" role="tablist" aria-label="Log record view">
            <button id="logsSideTabDetails" class="logsTabs__tab is-active" type="button" role="tab" aria-selected="true" data-side-tab="details">Details</button>
            <button id="logsSideTabContext" class="logsTabs__tab" type="button" role="tab" aria-selected="false" data-side-tab="context">Surrounding context</button>
          </div>
          <div id="logsSideDetails" class="logsSidePanel__body"></div>
          <div id="logsSideContext" class="logsSidePanel__body logsContext" hidden>
            <div class="logsContext__bar">
              <div class="logsSegmented" role="group" aria-label="Context scope">
                <button type="button" data-context-preset="anything" aria-pressed="true">Anything</button>
                <button type="button" data-context-preset="service" aria-pressed="false">Same service</button>
                <button type="button" data-context-preset="host" aria-pressed="false">Same host</button>
                <button type="button" data-context-preset="trace" aria-pressed="false">Same trace</button>
              </div>
              <div class="logsSegmented" role="group" aria-label="Context window">
                <button type="button" data-context-window="60000" aria-pressed="false">±1m</button>
                <button type="button" data-context-window="300000" aria-pressed="true">±5m</button>
                <button type="button" data-context-window="900000" aria-pressed="false">±15m</button>
                <button type="button" data-context-window="3600000" aria-pressed="false">±1h</button>
              </div>
            </div>
            <div id="logsContextRows" class="logsContext__rows"></div>
          </div>
        </aside>
      </div>
    </section>
  </main>

  <script>
    (function () {
      var script = document.createElement("script");
      script.src = (window.__chdashUrl ? window.__chdashUrl("static/app_logs_bootstrap.js") : "/static/app_logs_bootstrap.js");
      document.body.appendChild(script);
    })();
  </script>
</body>
</html>
