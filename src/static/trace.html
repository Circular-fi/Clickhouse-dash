<!doctype html>
<html lang="en">
<head>

  <title>ClickHouse Dash · Trace</title>
  <script>
    (function () {
      try {
        var pathname = String(window.location.pathname || "/");
        var marker = pathname.indexOf("/observability");
        if (marker < 0) marker = pathname.indexOf("/explorer");
        if (marker < 0) marker = pathname.indexOf("/query");
        var prefix = marker >= 0 ? pathname.slice(0, marker) : pathname.replace(/\/+$/g, "");
        if (!prefix || prefix === "/") prefix = "";
        var appBase = (prefix ? prefix : "") + "/";
        window.__CHDASH_BASE_PATH__ = appBase;
        window.__chdashUrl = function (path) {
          var raw = String(path || "");
          if (/^[a-z][a-z0-9+.-]*:/i.test(raw) || raw.startsWith("//")) return raw;
          var rel = raw.replace(/^\/+/, "");
          // A script or stylesheet of this binary has its content hash (the staged shells carry the map,
          // tools/stage_static.py): the address never changes content, so the browser keeps it.
          var hash = window.__chdashAssetVersions && window.__chdashAssetVersions[rel];
          return appBase + rel + (hash ? "?v=" + hash : "");
        };
        // The page switcher is part of the page shell and never waits on
        // /api/version. Only a server that last reported no other page hides it,
        // before the first paint.
        try {
          var pageNav = JSON.parse(localStorage.getItem("chdash.pageNav.v1") || "null");
          if (pageNav && pageNav.explorer === false && pageNav.system === false && pageNav.traces !== true && pageNav.logs !== true && pageNav.metrics !== true) {
            document.documentElement.classList.add("chdash-page-select-hidden");
          }
        } catch (_) {}
        // Written by the parser, not appended: a script-appended <link> does not
        // block rendering, so the shell would first paint unstyled and restyle
        // once the stylesheet lands.
        var cssHref = window.__chdashUrl("static/style.trace.css").replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        document.write('<link rel="stylesheet" href="' + cssHref + '">');
        var favicon = document.createElement("link");
        favicon.rel = "icon"; favicon.type = "image/svg+xml";
        favicon.href = window.__chdashUrl("static/images/logo.svg");
        document.head.appendChild(favicon);
        var fallbackIcon = document.createElement("link");
        fallbackIcon.rel = "alternate icon"; fallbackIcon.sizes = "any";
        fallbackIcon.href = window.__chdashUrl("static/images/favicon.ico");
        document.head.appendChild(fallbackIcon);
        var mode = localStorage.getItem("chdash.theme");
        if (mode !== "dark" && mode !== "light" && mode !== "system") mode = "system";
        if (mode === "dark" || mode === "light") document.documentElement.dataset.theme = mode;
        else delete document.documentElement.dataset.theme;
        document.documentElement.dataset.themeMode = mode;
        window.__chdashEarlyState = { themeMode: mode };
      } catch (_) {}
    })();
  </script>
  <!-- shell:fonts -->
  <!-- Generated by tools/build_page_css.py from tools/page_shells.py (FONT_PRELOADS): edit it there, then rerun the script. -->
  <script>
    (function () {
      if (!window.__chdashUrl) return;
      // The icon sprite (tools/icons.py): a new drawing is a new address.
      window.__chdashIconSprite = window.__chdashUrl("static/icons.svg?v=2972138764");
      // Parsed right after the stylesheet link, so the fonts download with it.
      var fonts = ["IBMPlexSans-Regular-Latin1.woff2", "IBMPlexSans-Medium-Latin1.woff2", "IBMPlexMono-Regular-Latin1.woff2"];
      for (var i = 0; i < fonts.length; i += 1) {
        var href = window.__chdashUrl("static/fonts/" + fonts[i]).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
        document.write('<link rel="preload" href="' + href + '" as="font" type="font/woff2" crossorigin>');
      }
    })();
  </script>
  <!-- /shell:fonts -->
</head>
<body data-page="trace">
  <!-- shell:header -->

  <header class="appHeader" role="banner">
    <div class="appHeader__left">
      <div class="appBrand">
        <svg class="appBrand__logo" viewBox="0 0 18 18" aria-hidden="true"><rect x="0.75" y="10.5" width="3" height="6" rx="1"/><rect x="5.25" y="5.5" width="3" height="11" rx="1"/><rect x="9.75" y="8" width="3" height="8.5" rx="1"/><rect x="14.25" y="1.5" width="3" height="15" rx="1"/></svg>
        <span class="appBrand__name">ClickHouse Dash</span>
        <span id="versionBadge" class="versionBadge" title="Backend version">--</span>
      </div>
    </div>
    <div class="appHeader__right">
      <div id="hostPicker" class="picker" aria-label="Target host">
        <button
          id="hostPickerButton"
          class="button picker__button"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          title="Target host">
          <span id="hostPickerDot" class="hostDot hostDot--bad" aria-hidden="true"></span>
          <span id="hostPickerText" class="picker__text">Host</span>
          <span id="hostPickerVersion" class="hostVersion" aria-label="clickhouse version"></span>
          <span id="hostPickerPing" class="hostPing" aria-label="ping"></span>
        </button>
        <div id="hostPickerMenu" class="picker__menu" role="listbox" tabindex="-1" hidden></div>
      </div>
      <div id="pageSelect" class="themeSelect pageSelect" aria-label="Page">
        <button id="pageSelectButton" class="button themeSelect__button pageSelect__button" type="button" aria-haspopup="listbox" aria-expanded="false">Observability</button>
        <div id="pageSelectMenu" class="themeSelect__menu pageSelect__menu" role="listbox" tabindex="-1" hidden>
          <button id="navQueryButton" class="themeSelect__option" type="button" role="option" data-value="query" aria-selected="false">Query</button>
          <button id="navExplorerButton" class="themeSelect__option" type="button" role="option" data-value="explorer" aria-selected="false">Explorer</button>
          <button id="navObservabilityButton" class="themeSelect__option" type="button" role="option" data-value="observability" aria-selected="true">Observability</button>
          <button id="navSystemButton" class="themeSelect__option" type="button" role="option" data-value="system" aria-selected="false">System</button>
        </div>
      </div>
      <div id="themeSelect" class="themeSelect themeSelect--icons" aria-label="Theme">
        <button
          id="themeSelectButton"
          class="button themeSelect__button themeSelect__button--icon"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-label="Theme: system"
          title="Theme">
          <span id="themeSelectText" class="themeSelect__current" aria-hidden="true"><svg class="icon icon--lg themeIcon themeIcon--system" aria-hidden="true"><use href="/static/icons.svg?v=2972138764#i-device-desktop"/></svg><svg class="icon icon--lg themeIcon themeIcon--dark" aria-hidden="true"><use href="/static/icons.svg?v=2972138764#i-moon"/></svg><svg class="icon icon--lg themeIcon themeIcon--light" aria-hidden="true"><use href="/static/icons.svg?v=2972138764#i-sun"/></svg></span>
        </button>
        <div id="themeSelectMenu" class="themeSelect__menu themeSelect__menu--icons" role="listbox" tabindex="-1" hidden>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="system" aria-label="System theme" title="System" aria-selected="true"><svg class="icon icon--lg themeIcon themeIcon--system" aria-hidden="true"><use href="/static/icons.svg?v=2972138764#i-device-desktop"/></svg></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="dark" aria-label="Dark theme" title="Dark" aria-selected="false"><svg class="icon icon--lg themeIcon themeIcon--dark" aria-hidden="true"><use href="/static/icons.svg?v=2972138764#i-moon"/></svg></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="light" aria-label="Light theme" title="Light" aria-selected="false"><svg class="icon icon--lg themeIcon themeIcon--light" aria-hidden="true"><use href="/static/icons.svg?v=2972138764#i-sun"/></svg></button>
        </div>
      </div>
      <script>
        (function () {
          try {
            var early = window.__chdashEarlyState || {};
            var mode = early.themeMode || "system";
            if (mode !== "system" && mode !== "dark" && mode !== "light") mode = "system";
            var trigger = document.getElementById("themeSelectButton");
            if (trigger) trigger.setAttribute("aria-label", "Theme: " + mode);
            var menu = document.getElementById("themeSelectMenu");
            if (menu) {
              var opts = menu.querySelectorAll(".themeSelect__option[data-value]");
              for (var i = 0; i < opts.length; i += 1) {
                opts[i].setAttribute("aria-selected", String(opts[i].getAttribute("data-value") === mode));
              }
            }
          } catch (_) {}
        })();
      </script>
    </div>
  </header>
  <!-- /shell:header -->

  <!-- One trace is a page of its own (/observability/traces/<trace id>): the header, but not the
       Observability view tabs (#obsNav). One h1 per page, as on the other pages. -->
  <h1 class="srOnly">Trace</h1>

  <main id="tracesWorkspace" class="tracesWorkspace tracesWorkspace--jaeger" role="main">
    <section class="tracesShell tracesShell--jaeger">
      <div id="tracesError" class="uiBanner" role="alert" hidden></div>

      <section id="traceDetail" class="traceDetailPane traceDetailPane--jaeger" aria-label="Trace">
        <header id="traceDetailHeader" class="tracePageHeader">
          <div class="tracePageHeader__titleRow">
            <button id="traceBackButton" type="button" class="pageBack" aria-label="Back to trace search" title="Back to search"><svg class="icon icon--lg" aria-hidden="true"><use href="/static/icons.svg?v=2972138764#i-arrow-left"/></svg></button>
            <div id="traceDetailTitle" class="tracePageHeader__title"><strong>Trace</strong><span>Select a trace to inspect its spans.</span></div>
            <div id="traceDetailStats" class="tracePageHeader__overview"></div>
            <div id="traceCopySplit" class="runSplit copySplit traceCopySplit">
              <div class="runSplit__buttons">
                <button id="traceCopyJsonButton" class="button button--small resultsStack__copy runSplit__main" type="button" title="Copy trace JSON" disabled>Copy JSON</button>
                <button id="traceCopyMenuButton" class="button button--small runSplit__toggle" type="button" aria-haspopup="menu" aria-expanded="false" title="Copy options" disabled></button>
              </div>
              <div id="traceCopyMenu" class="runMenu copyMenu" role="menu" tabindex="-1" hidden>
                <button id="traceDownloadJsonButton" class="runMenu__opt" type="button" role="menuitem">
                  <span class="runMenu__optText">Download JSON</span>
                </button>
              </div>
            </div>
          </div>
          <div id="traceHighlights" class="traceHighlights" aria-label="Highlighted attributes" hidden></div>
        </header>
        <section id="traceLogsPanel" class="traceLogsPanel" aria-label="Trace logs" hidden></section>
        <div id="traceViewBar" class="traceViewBar" role="toolbar" aria-label="Trace view">
          <!-- The trace views: in-content tabs (app_ui_tabs.js); below 820 px the dropdown instead. -->
          <div id="traceViewTabs" class="contentTabs traceViewTabs" role="tablist" aria-label="Trace view">
            <button id="traceViewTab-timeline" class="contentTabs__tab is-active" type="button" role="tab" aria-selected="true" aria-controls="traceTimelineFrame" data-tab="timeline">Timeline</button>
            <button id="traceViewTab-graph" class="contentTabs__tab" type="button" role="tab" aria-selected="false" aria-controls="traceAltView" data-tab="graph" tabindex="-1">Graph</button>
            <button id="traceViewTab-statistics" class="contentTabs__tab" type="button" role="tab" aria-selected="false" aria-controls="traceAltView" data-tab="statistics" tabindex="-1">Statistics</button>
            <button id="traceViewTab-spans" class="contentTabs__tab" type="button" role="tab" aria-selected="false" aria-controls="traceAltView" data-tab="spans" tabindex="-1">Spans</button>
            <button id="traceViewTab-flamegraph" class="contentTabs__tab" type="button" role="tab" aria-selected="false" aria-controls="traceAltView" data-tab="flamegraph" tabindex="-1">Flamegraph</button>
          </div>
          <div class="traceViewBar__picker"><div class="themeSelect tracePicker"><select id="traceViewSelect" class="tracePicker__native" tabindex="-1" aria-hidden="true" aria-label="Trace view" data-field-label="View"><option value="timeline">Timeline</option><option value="graph">Graph</option><option value="statistics">Statistics</option><option value="spans">Spans</option><option value="flamegraph">Flamegraph</option></select><button class="button themeSelect__button tracePicker__button" type="button" aria-haspopup="listbox" aria-expanded="false" aria-disabled="false">View · Timeline</button><div class="themeSelect__menu tracePicker__menu" role="listbox" tabindex="-1" hidden></div></div></div>
          <div id="traceViewTools" class="traceViewBar__tools"></div>
        </div>
        <!-- The Timeline's own head (service filters, overview), under the tabs: the tab row stays put on every view. -->
        <div id="traceTimelineHead" class="traceTimelineHead">
          <div id="traceServiceFilters" class="traceServiceFilters" aria-label="Filter trace services"></div>
          <div id="traceOverview" class="traceOverview" aria-label="Trace overview"></div>
        </div>
        <div id="traceTimelineFrame" class="traceTimelineFrame">
          <div id="traceWaterfall" class="traceWaterfall traceWaterfall--jaeger"><div class="uiState uiState--empty"><p class="uiState__body">No trace selected.</p></div></div>
          <section id="traceInspector" class="traceInspector traceInspector--jaeger" hidden></section>
        </div>
        <section id="traceAltView" class="traceAltView" aria-label="Trace view" hidden></section>
      </section>
    </section>
  </main>

      if (!sprite || sprite.indexOf("/static/") === 0) return;
