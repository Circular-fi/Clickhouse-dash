<!-- The page header of every shell (query.html, explorer.html, traces.html, logs.html, metrics.html, system.html, ...).
     tools/build_page_css.py copies it into each shell between the
     "shell:header" markers: edit it here, then rerun the script.
     {{page.label}}: the page name; {{selected.<page>}}: "true" on that page;
     {{observability.hidden}}: " hidden" off the Observability page (app_ui.js
     shows the entry once /api/version enables a view); {{system.hidden}} stays
     empty (the System entry ships visible: app_ui.js hides it when
     /api/version turns system.enabled off). The inline script sets
     the theme button's label from the head script's mode before the first paint;
     its icon follows html[data-theme-mode] in CSS. The logo mark is inline (it
     paints with the first frame); the icons name the sprite from the root and
     tools/build_page_css.py stamps the sprite's hash into their addresses. -->
  <header class="appHeader" role="banner">
    <div class="appHeader__left">
      <div class="appBrand">
        <svg class="appBrand__logo" viewBox="0 0 18 18" aria-hidden="true"><rect x="0.75" y="10.5" width="3" height="6" rx="1"/><rect x="5.25" y="5.5" width="3" height="11" rx="1"/><rect x="9.75" y="8" width="3" height="8.5" rx="1"/><rect x="14.25" y="1.5" width="3" height="15" rx="1"/></svg>
        <span class="appBrand__name">ClickHouse Dash</span>
        <span id="versionBadge" class="versionBadge" title="Backend version">--</span>
      </div>
    </div>
    <div class="appHeader__right">
      <div id="hostPicker" class="picker" aria-label="Target host">
        <button
          id="hostPickerButton"
          class="button picker__button"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          title="Target host">
          <span id="hostPickerDot" class="hostDot hostDot--bad" aria-hidden="true"></span>
          <span id="hostPickerText" class="picker__text">Host</span>
          <span id="hostPickerVersion" class="hostVersion" aria-label="clickhouse version"></span>
          <span id="hostPickerPing" class="hostPing" aria-label="ping"></span>
        </button>
        <div id="hostPickerMenu" class="picker__menu" role="listbox" tabindex="-1" hidden></div>
      </div>
      <div id="pageSelect" class="themeSelect pageSelect" aria-label="Page">
        <button id="pageSelectButton" class="button themeSelect__button pageSelect__button" type="button" aria-haspopup="listbox" aria-expanded="false">{{page.label}}</button>
        <div id="pageSelectMenu" class="themeSelect__menu pageSelect__menu" role="listbox" tabindex="-1" hidden>
          <button id="navQueryButton" class="themeSelect__option" type="button" role="option" data-value="query" aria-selected="{{selected.query}}">Query</button>
          <button id="navExplorerButton" class="themeSelect__option" type="button" role="option" data-value="explorer" aria-selected="{{selected.explorer}}">Explorer</button>
          <button id="navObservabilityButton" class="themeSelect__option" type="button" role="option" data-value="observability" aria-selected="{{selected.observability}}"{{observability.hidden}}>Observability</button>
          <button id="navSystemButton" class="themeSelect__option" type="button" role="option" data-value="system" aria-selected="{{selected.system}}"{{system.hidden}}>System</button>
        </div>
      </div>
      <div id="themeSelect" class="themeSelect themeSelect--icons" aria-label="Theme">
        <button
          id="themeSelectButton"
          class="button themeSelect__button themeSelect__button--icon"
          type="button"
          aria-haspopup="listbox"
          aria-expanded="false"
          aria-label="Theme: system"
          title="Theme">
          <span id="themeSelectText" class="themeSelect__current" aria-hidden="true"><svg class="icon icon--lg themeIcon themeIcon--system" aria-hidden="true"><use href="/static/icons.svg#i-device-desktop"/></svg><svg class="icon icon--lg themeIcon themeIcon--dark" aria-hidden="true"><use href="/static/icons.svg#i-moon"/></svg><svg class="icon icon--lg themeIcon themeIcon--light" aria-hidden="true"><use href="/static/icons.svg#i-sun"/></svg></span>
        </button>
        <div id="themeSelectMenu" class="themeSelect__menu themeSelect__menu--icons" role="listbox" tabindex="-1" hidden>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="system" aria-label="System theme" title="System" aria-selected="true"><svg class="icon icon--lg themeIcon themeIcon--system" aria-hidden="true"><use href="/static/icons.svg#i-device-desktop"/></svg></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="dark" aria-label="Dark theme" title="Dark" aria-selected="false"><svg class="icon icon--lg themeIcon themeIcon--dark" aria-hidden="true"><use href="/static/icons.svg#i-moon"/></svg></button>
          <button type="button" class="themeSelect__option themeSelect__option--icon" role="option" data-value="light" aria-label="Light theme" title="Light" aria-selected="false"><svg class="icon icon--lg themeIcon themeIcon--light" aria-hidden="true"><use href="/static/icons.svg#i-sun"/></svg></button>
        </div>
      </div>
      <script>
        (function () {
          try {
            var early = window.__chdashEarlyState || {};
            var mode = early.themeMode || "system";
            if (mode !== "system" && mode !== "dark" && mode !== "light") mode = "system";
            var trigger = document.getElementById("themeSelectButton");
            if (trigger) trigger.setAttribute("aria-label", "Theme: " + mode);
            var menu = document.getElementById("themeSelectMenu");
            if (menu) {
              var opts = menu.querySelectorAll(".themeSelect__option[data-value]");
              for (var i = 0; i < opts.length; i += 1) {
                opts[i].setAttribute("aria-selected", String(opts[i].getAttribute("data-value") === mode));
              }
            }
          } catch (_) {}
        })();
      </script>
    </div>
  </header>
