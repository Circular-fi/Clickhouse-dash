    <text x="292" y="196" font-size="30" font-weight="500" fill="#e0e7ff">A query console for ClickHouse</text>
    <text x="292" y="240" font-size="21" fill="#9ca3d4">One static binary. One HCL file. Results and counters stream live.</text>
