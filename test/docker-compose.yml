services:
  clickhouse-dash:
    image: clickhouse-dash:latest
    build:
        context: ../
        dockerfile: ./test/Dockerfile
        target: dev
    container_name: clickhouse-dash
    stop_grace_period: 0s
    restart: unless-stopped
    environment:
        CH_HOSTS: |
          health {
            interval_ms = 5000
            timeout_ms  = 800
          }
          clickhouse {
            host {
              name       = "local"
              runner_uri = "clickhouse://test:test@clickhouse:9000"
              system_uri = "clickhouse://test:test@clickhouse:9000"
            }
            host {
              name       = "local2"
              runner_uri = "clickhouse://test:test@clickhouse:9000"
              system_uri = "clickhouse://test:test@clickhouse:9000"
            }
          }
        LISTEN_HOST: "0.0.0.0"
        LISTEN_PORT: ${PORT:-8080}
    ports:
        - 8080:${PORT:-8080}
    depends_on:
        clickhouse:
          condition: service_healthy

  api-tests:
    build:
      context: ../
      dockerfile: ./test/api/Dockerfile
    container_name: api-tests
    environment:
      API_BASE_URL: http://clickhouse-dash:8080
      API_HEALTH_PATH: /api/health
      TEST_ARTIFACTS_DIR: /tests/artifacts
    depends_on:
      clickhouse-dash:
        condition: service_healthy

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1' | grep -q '1'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped