services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse
    environment:
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user test --password test --query 'SELECT 1' | grep -q '1'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  update-sql-raw:
    build:
      context: ../../
      dockerfile: ./test/api/Dockerfile
    container_name: api-tests-format
    command: ["python", "/tests/main.py", "update-raw"]
    environment:
      CLICKHOUSE_URL: http://clickhouse:8123
      CLICKHOUSE_USER: test
      CLICKHOUSE_PASSWORD: test
      CLICKHOUSE_RAW_DIR: /tests/artifacts/sql_raw
    volumes:
      - ./format/sql:/tests/format/sql:ro
      - ./format/sql_raw:/tests/artifacts/sql_raw
    depends_on:
      clickhouse:
        condition: service_healthy
