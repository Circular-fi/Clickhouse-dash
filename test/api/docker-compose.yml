services:
  clickhouse:
    image: clickhouse/clickhouse-server:24.8
    container_name: format-test-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping | grep -q Ok."]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  format-tests:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      clickhouse:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      API_BASE_URL: ${API_BASE_URL:-http://host.docker.internal:8080}
      API_HEALTH_PATH: ${API_HEALTH_PATH:-/api/health}
      API_TIMEOUT_SECONDS: ${API_TIMEOUT_SECONDS:-20}
      API_READY_TIMEOUT_SECONDS: ${API_READY_TIMEOUT_SECONDS:-120}
      CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_TIMEOUT_SECONDS: ${CLICKHOUSE_TIMEOUT_SECONDS:-20}
      CLICKHOUSE_READY_TIMEOUT_SECONDS: ${CLICKHOUSE_READY_TIMEOUT_SECONDS:-120}
      CLICKHOUSE_RAW_DIR: /artifacts/sql_raw
      UPDATE_EXPECTED_SQL: ${UPDATE_EXPECTED_SQL:-0}
      ASSERT_CLICKHOUSE_SUCCESS: ${ASSERT_CLICKHOUSE_SUCCESS:-1}
    volumes:
      - ./format/sql:/tests/format/sql
      - ./artifacts/sql_raw:/artifacts/sql_raw
    command: ["python", "/tests/main.py"]
